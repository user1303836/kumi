# nextest runs many test binaries at once. Tests that hold work to a time bound run alone, so the
# tests beside them can't make them late.
[[profile.default.overrides]]
# The Remote Script adapter's tests give each local connection 500 ms.
filter = 'test(/bounded_latency|reads_in_a_moment|looks_at_each_byte_once|read_in_linear_time|analyzed_quickly_part_by_part|keeps_the_runtime_responsive|returns_promptly|maximum_duplicate_ambiguity/) | (binary_id(ableton-mcp-server::it) & test(/^remote_adapter::/))'
threads-required = "num-cpus"

# CI's three sets (.github/workflows/ci.yml and extended.yml). A pull request and each push to main run `ci` on Linux and
# `ci-os` on macOS and Windows; the Extended workflow runs `extended`, every test, by hand, on the `full-tests` label and
# each week. What `ci` leaves out, and why:
# - the recorded-source oracles (a host workflow replayed against what the TypeScript host did, `…_match_source` and the
#   like): long replays of behaviour the port froze, which the unit tests beside them check in pieces;
# - the long listening, form and rendering simulations (whole songs analysed), the video tests (ffmpeg) and the
#   benchmarks;
# - the interoperability tests run beside the official MCP and model SDKs (npm), and the migration from the published
#   1.7.5 (downloaded);
# - the long sample-by-sample sweeps of the timing building blocks (kit::clock), each in every way Live and Max can differ:
#   the short tests beside them, which stay, check the same rules, except tempo changes and jumps by whole beats, which
#   only these sweeps check;
# - the layers tool's whole flows against its fake DAW (renders of every layer, aligned and glued): the tool's own tests,
#   the limiter's flow and what it needs stay;
# - REAPER's and Renoise's whole-flow runs on simulators: the listening flows (own_listening_e2e, fake_daw_listening:
#   renders, auditions, goals and judged rounds, a minute of CPU), the word checks over whole sessions (daw_words) and
#   the full-screen app's sessions (app_sessions). The engine's, the host's and the extension's own tests stay, and so do
#   the wire vectors, auth, the lifecycle, the change kinds' fences and the kind guards.
# Live's own pins (pin_first_request, the changes oracle) stay in `ci` whatever their names say.
[profile.ci]
default-filter = '''
not (
    (binary_id(kumi-runtime::it) & test(/^live_rendering::/)) | (binary_id(kumi-runtime::it) & test(/^form::/)) | (binary_id(kumi-runtime::it) & test(/^video::/))
  | (binary_id(kumi-runtime::it) & test(/^own_listening_e2e::/)) | (binary_id(kumi-runtime::it) & test(/^fake_daw_listening::/))
  | binary_id(kumi::daw_words) | binary_id(kumi::app_sessions)
  | (binary_id(kumi-runtime::it) & test(/^listening::/)) | (binary_id(kumi-runtime::it) & test(/^effects::/)) | (binary_id(kumi-runtime::it) & test(/^sound::/))
  | (binary_id(kumi-runtime::it) & test(/^style_references::/)) | (binary_id(kumi-runtime::it) & test(/^ai_sdk::/))
  | (binary_id(ableton-mcp-server::it) & test(/^benchmark::/)) | (binary_id(ableton-mcp-server::it) & test(/^lifecycle_migration::/))
  | ((binary_id(kumi-runtime::it) & test(/^mcp::/)) & not test(/read_buffer_looks_at_each_byte/))
  | ((binary_id(kumi-runtime::it) & test(/^media_foundations::/)) & test(/a_quiet_listen_is_one_stretch|a_songs_form_sections_where/))
  | (test(/match(es)?_(the_)?(source|typescript)|source_oracle|oracle|matches?_typescript/)
      & not (binary_id(kumi-runtime::it) & test(/^changes::/)) & not (binary_id(kumi-runtime::it) & test(/^pin_first_request::/)))
  | test(/kit::clock::tests::(a_tempo_change_of_any_size|lives_loop_starts|play_after_a_stop|stopping_ends_the_steps|a_jump_lands_on_its_step|on_lives_own_recordings|a_tempo_ramp)/)
  | test(/kit::clock::tests::(steps_start_on_the_sample|a_start_inside_a_step|a_jump_by_whole_beats|a_tempo_rise_just_after|a_division_or_swing_moved)/)
  | test(/core::layers::fake_backend_tests::(a_late_flipped_layer|glue_hears_the_group)/)
)
'''
# A blocking test that runs past 30 s fails, by name: what takes that long belongs in `extended`, or needs making faster.
slow-timeout = { period = "15s", terminate-after = 2 }
fail-fast = false

# What differs by platform: installing, launching and updating; the terminal and stdin; Hands; paths, files and child
# processes; the store; and a few smoke tests. The Ableton bridge's install lifecycle runs in `ci` on Linux (in a
# moment there) and on every platform in `extended` (minutes on Windows). For REAPER and Renoise: their bridges going
# into the DAWs' own folders (own_providers), Kumi's host on its loopback sockets to them (bridge, retire, credit), and
# what each system decides for them (daw-bridge's system: a bridge's process, macOS's downloaded mark).
# The extension REAPER loads is built, loaded and called through its C++ shim on every platform by CI's REAPER job.
# For Logic: the host starting its bridge as a process of Kumi's own (logic_spawn); the bridge crate's every test runs
# in CI's Logic job on macOS.
[profile.ci-os]
default-filter = '''
(
    binary(install) | binary(cli_binary) | (binary(cli) | (binary_id(ableton-mcp-server::it) & test(/^cli::/))) | binary(update) | binary(bridge_setup) | binary(doctor)
  | binary(live_extension) | binary(report) | binary(login) | binary(config) | binary(history) | binary(library)
  | binary(stdin_handoff) | binary(terminal) | binary(tui) | binary(voice_input) | (binary_id(kumi-runtime::it) & test(/^hands_transport::/)) | (binary_id(kumi-runtime::it) & test(/^auth::/))
  | (binary(system) | (binary_id(kumi-runtime::it) & test(/^system::/))) | (binary_id(kumi-runtime::it) & test(/^disk::/)) | (binary_id(kumi-runtime::it) & test(/^samples::/)) | (binary_id(kumi-runtime::it) & test(/^project_runtime::/)) | (binary_id(kumi-runtime::it) & test(/^library_files::/))
  | (binary_id(kumi-runtime::it) & test(/^library_learn::/)) | ((binary_id(ableton-mcp-server::it) & test(/^library_search::/)) | (binary_id(kumi-runtime::it) & test(/^library_search::/))) | (binary_id(kumi-runtime::it) & test(/^library_state_plan::/)) | (binary_id(kumi-runtime::it) & test(/^voice::/)) | (binary_id(kumi-runtime::it) & test(/^local_servers::/))
  | (binary_id(kumi-runtime::it) & test(/^session::/)) | (binary_id(kumi-runtime::it) & test(/^agent::/)) | (binary_id(ableton-mcp-server::it) & test(/^lifecycle_release::/)) | (binary_id(ableton-mcp-server::it) & test(/^delivery::/)) | (binary_id(ableton-mcp-server::it) & test(/^delivery_cli::/))
  | (binary_id(ableton-mcp-server::it) & test(/^extension_launcher::/)) | (binary_id(ableton-mcp-server::it) & test(/^extension_channel::/)) | (binary_id(ableton-mcp-server::it) & test(/^stdio::/)) | (binary_id(ableton-mcp-server::it) & test(/^fixture_paths::/)) | (binary_id(ableton-mcp-server::it) & test(/^project::/))
  | (binary_id(ableton-mcp-server::it) & test(/^host_probes::/)) | (binary_id(ableton-mcp-server::it) & test(/^analysis_runner::/)) | (binary_id(ableton-mcp-server::it) & test(/^sqlite_reader::/)) | (binary_id(ableton-mcp-server::it) & test(/^native_connected::/))
  | (binary_id(ableton-mcp-server::it) & test(/^remote_adapter::/)) | (binary_id(ableton-mcp-server::it) & test(/^loopback::/)) | (binary_id(kumi-runtime::it) & test(/^ai_transport::/)) | (binary_id(kumi-runtime::it) & test(/^network::/)) | binary(store)
  | binary(willington) | binary(windows_console_control) | binary(windows_stdin) | binary(windows_tty)
  | binary(own_providers) | binary(bridge) | binary(retire) | binary(credit) | binary(logic_spawn)
) & not (
    (binary_id(kumi-runtime::it) & test(/^live_rendering::/)) | (binary_id(kumi-runtime::it) & test(/^form::/)) | (binary_id(kumi-runtime::it) & test(/^video::/))
  | (binary_id(kumi-runtime::it) & test(/^listening::/)) | (binary_id(kumi-runtime::it) & test(/^effects::/)) | (binary_id(kumi-runtime::it) & test(/^sound::/))
  | (binary_id(kumi-runtime::it) & test(/^style_references::/)) | (binary_id(kumi-runtime::it) & test(/^ai_sdk::/))
  | (binary_id(ableton-mcp-server::it) & test(/^benchmark::/)) | (binary_id(ableton-mcp-server::it) & test(/^lifecycle_migration::/))
  | ((binary_id(kumi-runtime::it) & test(/^mcp::/)) & not test(/read_buffer_looks_at_each_byte/))
  | ((binary_id(kumi-runtime::it) & test(/^media_foundations::/)) & test(/a_quiet_listen_is_one_stretch|a_songs_form_sections_where/))
  | (test(/match(es)?_(the_)?(source|typescript)|source_oracle|oracle|matches?_typescript/)
      & not (binary_id(kumi-runtime::it) & test(/^changes::/)) & not (binary_id(kumi-runtime::it) & test(/^pin_first_request::/)))
  | test(/kit::clock::tests::(a_tempo_change_of_any_size|lives_loop_starts|play_after_a_stop|stopping_ends_the_steps|a_jump_lands_on_its_step|on_lives_own_recordings|a_tempo_ramp)/)
  | test(/kit::clock::tests::(steps_start_on_the_sample|a_start_inside_a_step|a_jump_by_whole_beats|a_tempo_rise_just_after|a_division_or_swing_moved)/)
  | test(/core::layers::fake_backend_tests::(a_late_flipped_layer|glue_hears_the_group)/)
)
'''
slow-timeout = { period = "15s", terminate-after = 2 }
fail-fast = false

# Every test. The longest (a Windows install lifecycle, a migration from 1.7.5) take two minutes; four is a hang.
[profile.extended]
default-filter = 'all()'
slow-timeout = { period = "60s", terminate-after = 4 }
fail-fast = false
