name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, label: Linux }
          - { os: macos-15, label: macOS }
          - { os: windows-2025, label: Windows }
    timeout-minutes: 45
    steps:
      - name: Stop Windows Defender scanning the workspace (it slows every file the build touches)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/kumi-runtime/tests/support/package-lock.json
      - name: Install the official MCP and model SDKs the interoperability tests run beside Kumi's
        run: npm ci --prefix crates/kumi-runtime/tests/support --ignore-scripts
      - run: cargo fmt --all --check
      - name: Windows input regressions
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RUST_TEST_NOCAPTURE: '1'
        run: ./scripts/test-isolated.ps1 --test stdin_handoff --test windows_console_control --test windows_stdin --test windows_tty --no-fail-fast
      - run: cargo build --workspace --all-targets --locked
      - name: Tests, in a home of their own (no test reaches this machine's Live folders or ~/.kumi)
        if: runner.os != 'Windows'
        run: sh scripts/test-isolated.sh --no-fail-fast
      - name: Tests, in a home of their own (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-isolated.ps1 --no-fail-fast
      - name: Clippy (advisory while the port is under way)
        continue-on-error: true
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: git diff --check

  remote-script:
    name: Python Remote Script / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    defaults:
      run:
        shell: bash
        working-directory: remote-script
    steps:
      - name: Stop Windows Defender scanning the workspace
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24)
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s . -p 'test_*.py'
      - run: python -m compileall -q AbletonMcpBridge

  live-extension:
    # Its type check needs the Ableton Extensions SDK, which can't be redistributed; the tests run Live fakes.
    name: Live extension
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/live-extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (Node 24)
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/live-extension/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test

  scripts:
    name: Release scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          fetch-depth: 0
      - name: Check committed whitespace in this change
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "origin/${GITHUB_BASE_REF}...HEAD"
          else
            git diff-tree --check --no-commit-id -r HEAD
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24)
        with:
          python-version: "3.13"
      - name: Native release packaging
        run: python3 -m unittest discover -s scripts/tests -p test_native_release.py

  required:
    name: Required CI
    if: always()
    needs: [rust, remote-script, live-extension, scripts]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every job above
        shell: bash
        run: |
          set -euo pipefail
          test "${{ needs.rust.result }}" = "success"
          test "${{ needs.remote-script.result }}" = "success"
          test "${{ needs.live-extension.result }}" = "success"
          test "${{ needs.scripts.result }}" = "success"
