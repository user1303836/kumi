name: CI

# Kumi's CI is the bare minimum (AGENTS.md, "Minimal CI"). A pull request runs one job, Required CI, on Linux: the
# repository's own checks and, for a change to Rust, formatting and the build. No tests. They run after the merge, on
# main, on Linux, and on any branch by hand (Actions > CI > Run workflow, or `gh workflow run CI --ref <branch>`), and a
# release waits for main's run. Nothing here runs on macOS or Windows: the Installer's nightly and tag builds do.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push replaces a run still under way: a pull request's, or a branch's run by hand. Each push to main keeps its
  # own: a release waits for main's run on the commit it releases.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: true

env:
  # Tests need no debug info or incremental artifacts: linking and the build cache stay small.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  # What a pull request changes: its merge commit against main, its first parent (Required CI checks out both,
  # fetch-depth 2), as `scripts/dev.py affected` reads it. A push or a run by hand checks everything.
  KUMI_BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}

jobs:
  required:
    # The check a pull request waits on, with Willington files, and the only job it runs: the change's whitespace; every
    # file belongs to a package or an area and the crates keep their layers; dev.py's, the release scripts' and the
    # models catalog's tests; the installers' syntax. Then, for a change that builds Rust (dev.py's rust_lint: not docs,
    # the Renoise tool's Lua or the Hermes plugin alone), `cargo fmt --check` and the build with the one Clippy lint that
    # gates. On main it builds every time, which keeps the caches pull requests restore.
    name: Required CI
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # The workspace's crates, which rust-cache never keeps, come from sccache's store in the Actions cache: main's pushes
      # write it and pull requests read it, so a pull request compiles only the crates it changed. The step that compiles
      # sets RUSTC_WRAPPER: rust-cache keys its cache on RUST* variables, so a job-wide one misses main's.
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: ${{ github.ref == 'refs/heads/main' && 'READ_WRITE' || 'READ_ONLY' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24)
        with:
          python-version: "3.13"
      - id: affected
        run: python3 scripts/dev.py affected ${KUMI_BASE:+--base "$KUMI_BASE"} --github-output
      - name: The change's whitespace
        run: |
          if [ -n "$KUMI_BASE" ]; then git diff --check "$KUMI_BASE" HEAD; else git diff-tree --check --no-commit-id -r HEAD; fi
      - name: Every tracked file belongs to a package or an area, the crates keep their layers, and the scripts' tests
        run: |
          python3 scripts/dev.py affected --check
          python3 scripts/dev.py deps --check
          python3 -m unittest discover -s scripts/tests -p test_dev.py
          python3 -m unittest discover -s scripts/tests -p test_native_release.py
          python3 -m unittest discover -s scripts/tests -p test_release.py
          python3 -m unittest discover -s scripts/tests -p test_models_catalog.py
      - name: The installers are POSIX sh, and PowerShell that parses and is ASCII
        run: sh scripts/check-installers.sh .
      - if: steps.affected.outputs.rust_lint == 'true'
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy
      - if: steps.affected.outputs.rust_lint == 'true'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0
      # Saved from main only: a pull request restores main's. By name, the one the lint's cache has always had.
      - if: steps.affected.outputs.rust_lint == 'true'
        uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          shared-key: rust-lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: steps.affected.outputs.rust_lint == 'true'
        run: cargo fmt --all --check
      # Everything runs on one thread with Rc<RefCell<…>>: a borrow held across an await panics when another task borrows
      # the same cell meanwhile. That one lint gates; the rest of Clippy is the author's to run.
      - name: It builds, and no RefCell borrow is held across an await
        if: steps.affected.outputs.rust_lint == 'true'
        env:
          RUSTC_WRAPPER: sccache
        run: cargo clippy --workspace --lib --bins --examples --locked -- -A clippy::all -D clippy::await_holding_refcell_ref

  rust-linux:
    # The `ci` tests (.config/nextest.toml) of every package, after a merge and by hand, never on a pull request: in three
    # parts at once by crate, so no part builds every test binary: the app; Kumi's other crates (every package the other
    # two don't name, so a new crate is tested there); the bridges. A release waits for them (scripts/release.py).
    name: Rust / ${{ matrix.label }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # The workspace's crates from sccache (see Required CI; the step that compiles sets RUSTC_WRAPPER).
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: ${{ github.ref == 'refs/heads/main' && 'READ_WRITE' || 'READ_ONLY' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { part: app, label: Linux, cache: kumi, crates: "-p kumi" }
          - { part: crates, label: "Linux (Kumi's crates)", cache: kumi, crates: "--exclude kumi --exclude ableton-mcp-server --exclude daw-bridge --exclude daw-mcp-server --exclude reaper-kumi --exclude soundcraft-kumi" }
          - { part: bridges, label: "Linux (bridges)", cache: bridges, crates: "-p ableton-mcp-server -p daw-bridge -p daw-mcp-server -p reaper-kumi -p soundcraft-kumi" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0
      # Saved from main only. The app's and Kumi's crates' parts build the same crates from crates.io, so they share one
      # cache (the first to finish on main saves it); the bridges build others. Each cache has a name of its own, not the
      # job's: Extended's Linux build restores it by name.
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          shared-key: ${{ matrix.cache }}-rust-linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: nextest
      # A few tests run Node (the Live extension's fake peer); none needs the SDKs from npm.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: The tests, in a home of their own (no test reaches this machine's Live folders or ~/.kumi)
        env:
          RUSTC_WRAPPER: sccache
          KUMI_NEXTEST: "1"
          KUMI_NEXTEST_LIST: ${{ runner.temp }}/nextest-list.json
          # Temporary files in memory: the tests' homes, Sets and stores write and sync many small files, which a
          # runner's disk makes several times slower.
          TMPDIR: /dev/shm
        # (word splitting on purpose: the -p and --exclude options)
        run: sh scripts/test-isolated.sh --profile ci ${{ matrix.crates }}
      # The tests this part selected (`cargo nextest list`), to compare one run's tests with another's.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: nextest-list-ci-${{ matrix.part }}
          path: ${{ runner.temp }}/nextest-list.json
          if-no-files-found: ignore
          retention-days: 14

  daw-scripts:
    # What runs inside the DAWs, after a merge and by hand: the Remote Script's tests on Live's Python (3.11); the Live
    # extension's tests against its committed build (its type check needs the Ableton Extensions SDK, which can't be
    # redistributed; the tests run Live fakes); the Renoise tool's Lua tests (LuaJIT, against a mock of Renoise's API,
    # replaying the wire's conformance vectors) and lua-language-server's check against Renoise's own API definitions.
    # Every tool is pinned: a LuaJIT built from the commit the tests were written on, lua-language-server's release (by
    # checksum) and the API 6.2 tag of github.com/renoise/definitions.
    name: Remote Script, Live extension, Renoise tool
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24)
        with:
          python-version: "3.11"
      - name: The Remote Script's tests, on Live's Python
        working-directory: daws/ableton/remote-script
        run: |
          python3.11 -m unittest discover -s . -p 'test_*.py'
          python3.11 -m compileall -q AbletonMcpBridge
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (Node 24)
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: daws/ableton/live-extension/package-lock.json
      - name: The Live extension's tests
        working-directory: daws/ableton/live-extension
        run: |
          npm ci --ignore-scripts
          npm test
      - name: The Renoise tool's LuaJIT, built from a pinned commit
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/luajit"
          mkdir "$RUNNER_TEMP/luajit-src"
          cd "$RUNNER_TEMP/luajit-src"
          git init -q
          git fetch -q --depth 1 https://github.com/LuaJIT/LuaJIT.git 659a61693aa3b87661864ad0f12eee14c865cd7f
          git checkout -q FETCH_HEAD
          make -j"$(nproc)" PREFIX="$prefix" > /dev/null
          make install PREFIX="$prefix" > /dev/null
          echo "$prefix/bin" >> "$GITHUB_PATH"
      - name: lua-language-server 3.19.2, and Renoise's API 6.2 definitions
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o luals.tar.gz https://github.com/LuaLS/lua-language-server/releases/download/3.19.2/lua-language-server-3.19.2-linux-x64.tar.gz
          echo "93ad326b10f6c00911dd8c450fa098332dbd8f9f45d1052f5636a2d54479b947  luals.tar.gz" | sha256sum -c -
          mkdir luals
          tar -xzf luals.tar.gz -C luals
          mkdir definitions
          cd definitions
          git init -q
          git fetch -q --depth 1 https://github.com/renoise/definitions.git 08faaea744156f2f7eddc898eb46fd972453a1af
          git checkout -q FETCH_HEAD
          echo "$RUNNER_TEMP/luals/bin" >> "$GITHUB_PATH"
          echo "RENOISE_DEFINITIONS=$RUNNER_TEMP/definitions/library" >> "$GITHUB_ENV"
      - name: The Renoise tool's tests and the type check (a missing lua-language-server fails)
        env:
          KUMI_REQUIRE_LUALS: "1"
        run: sh daws/renoise/tests/run.sh

  hermes-plugin:
    # Kumi's Hermes Agent plugin (hermes-plugin/), after a merge and by hand: its tests on Hermes's own Python, and the
    # Hermes plugin catalog's admission checks with the Hermes it requires (v0.22.7, pinned by the tag's commit):
    # `hermes plugins validate --install-deps` (the catalog CI's own command), `hermes plugins doctor --ci`, the catalog's
    # payload scan (no compiled code in the plugin: its rule 17) and its self-updater check (rule 3). Hermes is prepared
    # as its plugin-validate action prepares it, in a folder of its own. Then the Desktop and dashboard halves' tests.
    name: Hermes plugin
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Hermes v0.22.7: the plugin's requires_hermes, and the Hermes the catalog's checks of it run on.
      HERMES_REF: b200f5bc60e31588ba2cb60e288029c4a54ba5fa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          # The job runs Hermes's plugin checks, which load the plugin's code: no token in .git/config.
          persist-credentials: false
      # The plugin's own floor, Python 3.11 (Hermes's v0.22.7 environment is newer).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24)
        with:
          python-version: "3.11"
      - name: Hermes v0.22.7 and its locked Python, in a folder of their own
        id: hermes
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/hermes-agent"
          git init -q "$source"
          git -C "$source" fetch -q --depth 1 https://github.com/NousResearch/hermes-agent.git "$HERMES_REF"
          git -C "$source" checkout -q --detach FETCH_HEAD
          python3 -S "$source/scripts/ci/setup_toolchain.py" prepare --toolchain python --home "$source/.build/pm"
          python3 -S "$source/scripts/ci/setup_toolchain.py" install --toolchain python --home "$source/.build/pm"
          echo "source=$source" >> "$GITHUB_OUTPUT"
      - name: Hermes's own environment, the one its plugin validator runs in
        id: runtime
        working-directory: ${{ steps.hermes.outputs.source }}
        env:
          SOURCE: ${{ steps.hermes.outputs.source }}
        run: |
          "$HERMES_PYTHON" - <<'PY'
          import os
          from pathlib import Path
          from pm import build_environment
          source = Path(os.environ["SOURCE"])
          python = build_environment(source=source, out=source / ".build/validator", explicit=True)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"python={python}\n")
          PY
      - name: The plugin's tests, on Python 3.11 and on Hermes's own Python
        env:
          PYTHON: ${{ steps.runtime.outputs.python }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3.11 -m unittest discover -s hermes-plugin/tests -p 'test_*.py'
          "$PYTHON" --version
          "$PYTHON" -m unittest discover -s hermes-plugin/tests -p 'test_*.py'
      - name: The Hermes catalog's checks (validate --install-deps, doctor --ci, the payload scan, the self-updater check)
        env:
          PYTHON: ${{ steps.runtime.outputs.python }}
          SOURCE: ${{ steps.hermes.outputs.source }}
          HERMES_HOME: ${{ runner.temp }}/hermes-home
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          "$PYTHON" -I -m hermes_cli.main plugins validate hermes-plugin --install-deps
          "$PYTHON" -I -m hermes_cli.main plugins doctor hermes-plugin --ci
          "$PYTHON" -I "$SOURCE/scripts/scan_plugin_payloads.py" hermes-plugin
          # The catalog CI's own check: a JS or TS file that both fetches from GitHub and writes files updates itself.
          updater=$(grep -rlZE 'releases/latest|releases/download|raw\.githubusercontent\.com|codeload\.github\.com' \
              --include='*.js' --include='*.mjs' --include='*.cjs' --include='*.ts' \
              --include='*.jsx' --include='*.tsx' --include='*.mts' --include='*.cts' hermes-plugin \
            | xargs -r0 grep -lE 'writeTextFile|renamePath|writeFile\(|writeFileSync|renameSync|copyFileSync|cpSync|createWriteStream' || true)
          if [ -n "$updater" ]; then
            echo "::error::self-updating code in the plugin (it fetches from GitHub and writes files): $updater"
            exit 1
          fi
      # The UI halves' sources and build live in hermes-plugin/ui/ (a package.json at the plugin's root would make Hermes
      # offer to install Node dependencies); their committed bundles are desktop/plugin.js and dashboard/dist/index.js.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (Node 24)
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hermes-plugin/ui/package-lock.json
      - name: The Desktop and dashboard halves' types and tests (on stub SDKs), and their committed builds match
        working-directory: hermes-plugin/ui
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npm test
          npm run check

  main-failed:
    # Pull requests run no tests, so main's run is the first to test a change, and a release waits for it: a red run
    # there opens an issue (or comments on the open one), naming the commit, for whoever broke it to fix first.
    name: Main's CI failed
    needs: [required, rust-linux, daw-scripts, hermes-plugin]
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # One at a time, so two red runs close together comment on one issue instead of opening two.
    concurrency:
      group: main-ci-failed
      cancel-in-progress: false
    permissions:
      issues: write
    steps:
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          title="Main's CI failed"
          body="CI failed on main at $SHA (${MESSAGE%%$'\n'*}): $RUN. Pull requests run no tests, so main's run is the first to test a change, and no release goes out until it's green: this comes first."
          open="$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")"
          if [ -n "$open" ]; then
            gh issue comment "$open" -R "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "$body" --label bug --label critical
          fi
