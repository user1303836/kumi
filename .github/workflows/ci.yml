name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A merge queue's run of a pull request on top of main checks it as the pull request's own run does.
  # Nothing triggers it until the repository has a merge queue.
  merge_group:

permissions:
  contents: read

concurrency:
  # A pull request's newer push replaces its run. Every other run (each push to main, a tag)
  # has a group of its own, so a newer one can't cancel it while it waits for a runner.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Tests need no debug info or incremental artifacts: linking and the build cache stay small.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.paths.outputs.remote_script }}
      rust: ${{ steps.paths.outputs.rust_linux }}
      reaper: ${{ steps.paths.outputs.reaper_extension }}
      renoise: ${{ steps.paths.outputs.renoise_tool }}
      packages: ${{ steps.paths.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          fetch-depth: 0
      - id: paths
        shell: bash
        run: |
          # Each world's jobs run for the changes they test, as scripts/dev.py reads them from the packages and
          # scripts/areas.toml (its docstring says which job runs for what); main runs every one. Documentation alone
          # skips the builds.
          case "${{ github.event_name }}" in
            pull_request) base="origin/${GITHUB_BASE_REF}" ;;
            merge_group) base="${{ github.event.merge_group.base_sha }}" ;;
            *) base= ;;
          esac
          python3 scripts/dev.py affected ${base:+--base "$base"} --github-output

  rust-linux:
    # The tests that guard producers' Sets and Kumi's wire, the unit tests and Live's pins: the `ci` set in
    # .config/nextest.toml. The long simulations, the recorded-source oracles, the SDK interoperability and migration
    # tests and the benchmarks are the Extended workflow's. Three runners at once, by crate, so no one builds every test
    # binary: Kumi and its runtime; Live's bridge (which needs only kumi-common); REAPER's and Renoise's bridges
    # (daw-bridge, the host, the extension; Kumi links the first two but none of their tests).
    name: Rust / ${{ matrix.label }}
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { part: kumi, label: Linux, crates: "--exclude ableton-mcp-server --exclude daw-bridge --exclude daw-mcp-server --exclude reaper-kumi" }
          - { part: live-bridge, label: "Linux (Live's bridge)", crates: "-p ableton-mcp-server" }
          - { part: daw-bridges, label: "Linux (DAW bridges)", crates: "-p daw-bridge -p daw-mcp-server -p reaper-kumi" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # This part's packages that the change affects, as `dev.py check` picks them (main's pushes: all of them). A part
      # with none skips the rest.
      - id: part
        env:
          AFFECTED: ${{ needs.changes.outputs.packages }}
        # (assigned first: a failing dev.py fails the step instead of picking nothing)
        run: |
          picked="$(python3 scripts/dev.py select "$AFFECTED" ${{ matrix.crates }})"
          echo "picked=$picked" | tee -a "$GITHUB_OUTPUT"
      - if: steps.part.outputs.picked != ''
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      # Saved from main only. A pull request restores main's; caches saved from pull requests (about 300 MB a job)
      # pushed main's out of the repository's 10 GB. One cache per part: each builds other crates.
      - if: steps.part.outputs.picked != ''
        uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          key: ${{ matrix.part }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: steps.part.outputs.picked != ''
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: nextest
      # A few tests run Node (the Live extension's fake peer); none needs the SDKs from npm.
      - if: steps.part.outputs.picked != ''
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: The tests, in a home of their own (no test reaches this machine's Live folders or ~/.kumi)
        if: steps.part.outputs.picked != ''
        env:
          KUMI_NEXTEST: "1"
          KUMI_NEXTEST_LIST: ${{ runner.temp }}/nextest-list.json
          # Temporary files in memory: the tests' homes, Sets and stores write and sync many small files, which a
          # runner's disk makes several times slower.
          TMPDIR: /dev/shm
        # (word splitting on purpose: the -p options)
        run: sh scripts/test-isolated.sh --profile ci ${{ steps.part.outputs.picked }}
      # The tests this part selected (`cargo nextest list`), to compare one run's with another's.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && steps.part.outputs.picked != '' }}
        with:
          name: nextest-list-ci-${{ matrix.part }}
          path: ${{ runner.temp }}/nextest-list.json
          if-no-files-found: ignore
          retention-days: 14
      - if: matrix.part == 'kumi'
        run: git diff --check

  rust-lint:
    name: Rust / Lint
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      # Everything runs on one thread with Rc<RefCell<…>>: a borrow held across an await panics when another
      # task borrows the same cell meanwhile. The rest of clippy stays advisory for now. (This builds the examples too;
      # the documentation tests are Extended's.)
      - name: No RefCell borrow held across an await
        run: cargo clippy --workspace --lib --bins --examples --locked -- -A clippy::all -D clippy::await_holding_refcell_ref
      - name: Clippy (advisory while the port is under way)
        continue-on-error: true
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  rust-platforms:
    # What differs by platform (the `ci-os` set): installing, launching and updating; the terminal and stdin, and the
    # Windows console; Hands; paths, files and child processes; the store. Each platform's every test runs in Extended.
    name: Rust / ${{ matrix.label }}
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, label: macOS }
          - { os: windows-2025, label: Windows }
    timeout-minutes: 10
    env:
      # Rust's own linker: Microsoft's is a large part of linking two hundred test binaries.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld
    steps:
      - name: Stop Windows Defender scanning the workspace (it slows every file the build touches)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      # Saved from main only (see Rust / Linux).
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: nextest
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: The tests, in a home of their own
        if: runner.os != 'Windows'
        env:
          KUMI_NEXTEST: "1"
          KUMI_NEXTEST_LIST: ${{ runner.temp }}/nextest-list.json
          # Only the test binaries the profile names are built.
          KUMI_NEXTEST_BUILD_PROFILE: ci-os
        run: sh scripts/test-isolated.sh --profile ci-os
      - name: The tests, in a home of their own (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          KUMI_NEXTEST: "1"
          KUMI_NEXTEST_LIST: ${{ runner.temp }}/nextest-list.json
          KUMI_NEXTEST_BUILD_PROFILE: ci-os
          RUST_TEST_NOCAPTURE: '1'
        run: ./scripts/test-isolated.ps1 --profile ci-os
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: nextest-list-ci-os-${{ runner.os }}
          path: ${{ runner.temp }}/nextest-list.json
          if-no-files-found: ignore
          retention-days: 14

  remote-script:
    name: Python Remote Script / ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # A pull request's run on macOS waited longest for a runner, for under a minute's work; each push to main runs
        # it there too.
        os: ${{ fromJSON((github.event_name == 'pull_request' || github.event_name == 'merge_group') && '["ubuntu-24.04", "windows-2025"]' || '["ubuntu-24.04", "macos-15", "windows-2025"]') }}
    defaults:
      run:
        shell: bash
        working-directory: remote-script
    steps:
      - name: Stop Windows Defender scanning the workspace
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24)
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s . -p 'test_*.py'
      - run: python -m compileall -q AbletonMcpBridge

  live-extension:
    # Its type check needs the Ableton Extensions SDK, which can't be redistributed; the tests run Live fakes.
    name: Live extension
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/live-extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (Node 24)
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/live-extension/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test

  reaper-extension:
    # The extension as it ships: the release build, unstripped by rustc (a rustc strip can misalign its LINKEDIT
    # string pool on macOS 27, and dyld then refuses it), then the platform's own strip, then checked as the release
    # script checks what a bundle carries and loaded by the system's loader with REAPER's entry point found. Linux on
    # the Ubuntu the bundles build on, whose glibc is the one the extension may need.
    name: REAPER extension loads / ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.reaper == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-22.04, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - name: Stop Windows Defender scanning the workspace
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          key: reaper-extension
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build it as it ships, and strip it with the platform's strip
        run: |
          # Windows links the C runtime statically, so REAPER needs no VC++ runtime installed.
          if [[ "$RUNNER_OS" == "Windows" ]]; then export RUSTFLAGS="-C target-feature=+crt-static"; fi
          cargo build -p reaper-kumi --release --locked
          case "$RUNNER_OS" in
            macOS) file=target/release/libreaper_kumi.dylib; strip -x "$file" ;;
            Linux) file=target/release/libreaper_kumi.so; strip --strip-unneeded "$file" ;;
            Windows) file=target/release/reaper_kumi.dll ;;
          esac
          echo "REAPER_KUMI_ARTIFACT=$PWD/$file" >> "$GITHUB_ENV"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24)
        with:
          python-version: "3.13"
      - name: It's what a bundle may carry (REAPER's entry point; signed and named for itself on macOS; the C runtime linked in on Windows; no newer glibc than Kumi's on Linux)
        run: |
          python scripts/build-native-release.py --check-extension "$REAPER_KUMI_ARTIFACT" --target "$(rustc -vV | sed -n 's/^host: //p')" --thin
      - name: It loads, with REAPER's entry point
        run: cargo test -p reaper-kumi --locked --test loads
      # REAPER calls the extension through the C++ shim's vtable, laid out by each platform's C++ ABI.
      - name: REAPER's calls through the shim's vtable reach Rust
        run: cargo test -p reaper-kumi --locked --lib csurf::tests

  renoise-tool:
    # The Renoise tool's Lua: its tests (LuaJIT, against a mock of Renoise's API, replaying the wire's conformance
    # vectors) and lua-language-server's check against Renoise's own API definitions. Every tool is pinned: a LuaJIT
    # built from the commit the tests were written on, lua-language-server's release (by checksum) and the API 6.2 tag
    # of github.com/renoise/definitions.
    name: Renoise tool
    needs: changes
    if: needs.changes.outputs.renoise == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: LuaJIT, built from a pinned commit
        shell: bash
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/luajit"
          mkdir "$RUNNER_TEMP/luajit-src"
          cd "$RUNNER_TEMP/luajit-src"
          git init -q
          git fetch -q --depth 1 https://github.com/LuaJIT/LuaJIT.git 659a61693aa3b87661864ad0f12eee14c865cd7f
          git checkout -q FETCH_HEAD
          make -j"$(nproc)" PREFIX="$prefix" > /dev/null
          make install PREFIX="$prefix" > /dev/null
          echo "$prefix/bin" >> "$GITHUB_PATH"
      - name: lua-language-server 3.19.2, and Renoise's API 6.2 definitions
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o luals.tar.gz https://github.com/LuaLS/lua-language-server/releases/download/3.19.2/lua-language-server-3.19.2-linux-x64.tar.gz
          echo "93ad326b10f6c00911dd8c450fa098332dbd8f9f45d1052f5636a2d54479b947  luals.tar.gz" | sha256sum -c -
          mkdir luals
          tar -xzf luals.tar.gz -C luals
          mkdir definitions
          cd definitions
          git init -q
          git fetch -q --depth 1 https://github.com/renoise/definitions.git 08faaea744156f2f7eddc898eb46fd972453a1af
          git checkout -q FETCH_HEAD
          echo "$RUNNER_TEMP/luals/bin" >> "$GITHUB_PATH"
          echo "RENOISE_DEFINITIONS=$RUNNER_TEMP/definitions/library" >> "$GITHUB_ENV"
      - name: The tool's tests and the type check (a missing lua-language-server fails)
        env:
          KUMI_REQUIRE_LUALS: "1"
        run: sh daws/renoise/tests/run.sh

  scripts:
    name: Release scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          fetch-depth: 0
      - name: Check committed whitespace in this change
        shell: bash
        run: |
          case "${{ github.event_name }}" in
            pull_request) git diff --check "origin/${GITHUB_BASE_REF}...HEAD" ;;
            merge_group) git diff --check "${{ github.event.merge_group.base_sha }}...HEAD" ;;
            *) git diff-tree --check --no-commit-id -r HEAD ;;
          esac
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24)
        with:
          python-version: "3.13"
      - name: Native release packaging (and every packaged document's links)
        run: python3 -m unittest discover -s scripts/tests -p test_native_release.py
      - name: The release script's edits
        run: python3 -m unittest discover -s scripts/tests -p test_release.py
      # CI picks its jobs by what a change affects (scripts/dev.py): every file has to belong to a package or an area.
      - name: Every tracked file belongs to a package or an area, and dev.py's tests
        run: |
          python3 scripts/dev.py affected --check
          python3 -m unittest discover -s scripts/tests -p test_dev.py
      # The install jobs run the paths that work; this reads every line, the error paths too.
      - name: The installers are POSIX sh, and PowerShell that parses and is ASCII
        run: sh scripts/check-installers.sh .
      # Older docs and links fetch main's raw installers, and the one-liners the latest release's: both have to stay
      # scripts that run. Pushes to main check them where producers fetch them.
      - name: The installers where producers fetch them (main's raw files, and the latest release's)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Both are checked, whichever fails.
          ok=0
          check() {
            mkdir -p "$2" && for name in install.sh install.ps1; do curl -fsSL --retry 3 -o "$2/$name" "$1/$name" || return; done
            sh scripts/check-installers.sh "$2"
          }
          check "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main" "$RUNNER_TEMP/main" || ok=1
          # The latest release, by the tag the API names: the releases/latest/download redirect can lag a publish by a
          # couple of minutes. Every release since the first one publish attached them to carries both.
          for _ in 1 2 3; do latest="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName,assets --jq '[.tagName] + [.assets[].name] | join(" ")')" && break; sleep 10; done
          if [[ " $latest " == *" install.sh "* && " $latest " == *" install.ps1 "* ]]; then
            check "https://github.com/$GITHUB_REPOSITORY/releases/download/${latest%% *}" "$RUNNER_TEMP/latest" || ok=1
          else
            echo "::notice::The latest release (${latest%% *}) has no installers attached yet."
          fi
          exit "$ok"

  required:
    name: Required CI
    if: always()
    needs: [changes, rust-linux, rust-lint, rust-platforms, remote-script, live-extension, reaper-extension, renoise-tool, scripts]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every job above (the builds may skip a documentation-only change)
        shell: bash
        run: |
          set -euo pipefail
          test "${{ needs.changes.result }}" = "success"
          test "${{ needs.scripts.result }}" = "success"
          # A job passed, or was skipped because nothing it tests changed.
          ok() { [[ "$1" == "success" || ( "$1" == "skipped" && "$2" == "false" ) ]]; }
          ok "${{ needs.rust-linux.result }}" "${{ needs.changes.outputs.rust }}"
          ok "${{ needs.rust-lint.result }}" "${{ needs.changes.outputs.rust }}"
          ok "${{ needs.rust-platforms.result }}" "${{ needs.changes.outputs.rust }}"
          ok "${{ needs.remote-script.result }}" "${{ needs.changes.outputs.code }}"
          ok "${{ needs.live-extension.result }}" "${{ needs.changes.outputs.code }}"
          ok "${{ needs.reaper-extension.result }}" "${{ needs.changes.outputs.reaper }}"
          ok "${{ needs.renoise-tool.result }}" "${{ needs.changes.outputs.renoise }}"
