name: CI

# Kumi's minimal CI (AGENTS.md, "Minimal CI"). A pull request runs one gate, on Linux, of what it changes: Required CI
# waits on these jobs and nothing else. macOS and Windows run after a merge, on main, and on any branch by hand
# (Actions > CI > Run workflow, or `gh workflow run CI --ref <branch>`). The rest of the tests run weekly, in Extended.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push replaces a run still under way: a pull request's, or a branch's run by hand. Each push to main keeps its
  # own: its macOS and Windows jobs are the only test of that commit on those systems, and a release waits for them.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: true

env:
  # Tests need no debug info or incremental artifacts: linking and the build cache stay small.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  # What a pull request changes: its merge commit against main, its first parent (each job checks out both, fetch-depth 2),
  # as `scripts/dev.py affected` reads it. A push or a run by hand tests everything.
  KUMI_BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}

jobs:
  rust-linux:
    # The `ci` tests (.config/nextest.toml) of the packages a change affects, in three parts at once by crate, so no part
    # builds every test binary: the app; Kumi's other crates (every package the other two don't name, so a new crate is
    # tested there); the bridges. A part the change gives nothing to test passes at once.
    name: Rust / ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # The workspace's crates, which rust-cache never keeps, come from sccache's store in the Actions cache: main's pushes
      # write it and pull requests read it (as rust-cache's), so a pull request compiles only the crates it changed. The
      # steps that compile set RUSTC_WRAPPER: rust-cache keys its cache on RUST* variables, so a job-wide one misses main's.
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: ${{ github.ref == 'refs/heads/main' && 'READ_WRITE' || 'READ_ONLY' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { part: app, label: Linux, cache: kumi, crates: "-p kumi" }
          - { part: crates, label: "Linux (Kumi's crates)", cache: kumi, crates: "--exclude kumi --exclude ableton-mcp-server --exclude daw-bridge --exclude daw-mcp-server --exclude reaper-kumi --exclude soundcraft-kumi" }
          - { part: bridges, label: "Linux (bridges)", cache: bridges, crates: "-p ableton-mcp-server -p daw-bridge -p daw-mcp-server -p reaper-kumi -p soundcraft-kumi" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      - id: affected
        run: python3 scripts/dev.py affected ${KUMI_BASE:+--base "$KUMI_BASE"} --github-output
      # This part's affected packages, as `dev.py check` picks them. None skips the rest.
      - id: part
        env:
          AFFECTED: ${{ steps.affected.outputs.packages }}
        # (assigned first: a failing dev.py fails the step instead of picking nothing)
        run: |
          picked="$(python3 scripts/dev.py select "$AFFECTED" ${{ matrix.crates }})"
          echo "picked=$picked" | tee -a "$GITHUB_OUTPUT"
      - if: steps.part.outputs.picked != ''
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - if: steps.part.outputs.picked != ''
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0
      # Saved from main only. A pull request restores main's; caches saved from pull requests (about 300 MB a job)
      # pushed main's out of the repository's 10 GB. The app's and Kumi's crates' parts build the same crates from
      # crates.io, so they share one cache (the first to finish on main saves it); the bridges build others. Each cache
      # has a name of its own, not the job's: Extended's jobs restore them by name.
      - if: steps.part.outputs.picked != ''
        uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          shared-key: ${{ matrix.cache }}-rust-linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: steps.part.outputs.picked != ''
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: nextest
      # A few tests run Node (the Live extension's fake peer); none needs the SDKs from npm.
      - if: steps.part.outputs.picked != ''
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: The tests, in a home of their own (no test reaches this machine's Live folders or ~/.kumi)
        if: steps.part.outputs.picked != ''
        env:
          RUSTC_WRAPPER: sccache
          KUMI_NEXTEST: "1"
          KUMI_NEXTEST_LIST: ${{ runner.temp }}/nextest-list.json
          # Temporary files in memory: the tests' homes, Sets and stores write and sync many small files, which a
          # runner's disk makes several times slower.
          TMPDIR: /dev/shm
        # (word splitting on purpose: the -p options)
        run: sh scripts/test-isolated.sh --profile ci ${{ steps.part.outputs.picked }}
      # The tests this part selected (`cargo nextest list`), which `dev.py worktree extended-only` reads.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && steps.part.outputs.picked != '' }}
        with:
          name: nextest-list-ci-${{ matrix.part }}
          path: ${{ runner.temp }}/nextest-list.json
          if-no-files-found: ignore
          retention-days: 14

  rust-lint:
    name: Rust / Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # The workspace's crates from sccache (see Rust / Linux; the steps that compile set RUSTC_WRAPPER).
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: ${{ github.ref == 'refs/heads/main' && 'READ_WRITE' || 'READ_ONLY' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      - id: affected
        run: python3 scripts/dev.py affected ${KUMI_BASE:+--base "$KUMI_BASE"} --github-output
      - if: steps.affected.outputs.rust_lint == 'true'
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy
      - if: steps.affected.outputs.rust_lint == 'true'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0
      - if: steps.affected.outputs.rust_lint == 'true'
        uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: steps.affected.outputs.rust_lint == 'true'
        run: cargo fmt --all --check
      # Everything runs on one thread with Rc<RefCell<…>>: a borrow held across an await panics when another task borrows
      # the same cell meanwhile. That one lint gates; the rest of Clippy is the author's to run.
      - name: No RefCell borrow held across an await
        if: steps.affected.outputs.rust_lint == 'true'
        env:
          RUSTC_WRAPPER: sccache
        run: cargo clippy --workspace --lib --bins --examples --locked -- -A clippy::all -D clippy::await_holding_refcell_ref

  checks:
    # Everything else a pull request is held to, in one job: the change's whitespace; the repository's own checks (every
    # file belongs to a package or an area, the crates keep their layers, dev.py's and the release scripts' tests, the
    # installers' syntax); the Remote Script's and the Live extension's tests for any change but to docs; the Renoise
    # tool's tests and type check when it (or this workflow) changes.
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          fetch-depth: 2
      # The scripts' Python, and Live's own (3.11) for the Remote Script. The last is `python3`.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24)
        with:
          python-version: |
            3.11
            3.13
      - id: affected
        run: python3 scripts/dev.py affected ${KUMI_BASE:+--base "$KUMI_BASE"} --github-output
      - name: The change's whitespace
        run: |
          if [ -n "$KUMI_BASE" ]; then git diff --check "$KUMI_BASE" HEAD; else git diff-tree --check --no-commit-id -r HEAD; fi
      # CI picks what it tests by what a change affects (scripts/dev.py): every file has to belong to a package or an area.
      # And the crates keep their layers: dependencies point down, and the DAWs' crates don't use each other's.
      - name: Every tracked file belongs to a package or an area, the crates keep their layers, and dev.py's tests
        run: |
          python3 scripts/dev.py affected --check
          python3 scripts/dev.py deps --check
          python3 -m unittest discover -s scripts/tests -p test_dev.py
      - name: The release scripts, the packaging (and every packaged document's links), and the models catalog
        run: |
          python3 -m unittest discover -s scripts/tests -p test_native_release.py
          python3 -m unittest discover -s scripts/tests -p test_release.py
          python3 -m unittest discover -s scripts/tests -p test_models_catalog.py
      - name: The installers are POSIX sh, and PowerShell that parses and is ASCII
        run: sh scripts/check-installers.sh .
      - name: The Remote Script's tests, on Live's Python
        if: steps.affected.outputs.remote_script == 'true'
        working-directory: daws/ableton/remote-script
        run: |
          python3.11 -m unittest discover -s . -p 'test_*.py'
          python3.11 -m compileall -q AbletonMcpBridge
      # Its type check needs the Ableton Extensions SDK, which can't be redistributed; the tests run Live fakes.
      - if: steps.affected.outputs.live_extension == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (Node 24)
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: daws/ableton/live-extension/package-lock.json
      - name: The Live extension's tests
        if: steps.affected.outputs.live_extension == 'true'
        working-directory: daws/ableton/live-extension
        run: |
          npm ci --ignore-scripts
          npm test
      # The Renoise tool's Lua: its tests (LuaJIT, against a mock of Renoise's API, replaying the wire's conformance
      # vectors) and lua-language-server's check against Renoise's own API definitions. Every tool is pinned: a LuaJIT
      # built from the commit the tests were written on, lua-language-server's release (by checksum) and the API 6.2 tag
      # of github.com/renoise/definitions.
      - name: The Renoise tool's LuaJIT, built from a pinned commit
        if: steps.affected.outputs.renoise_tool == 'true'
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/luajit"
          mkdir "$RUNNER_TEMP/luajit-src"
          cd "$RUNNER_TEMP/luajit-src"
          git init -q
          git fetch -q --depth 1 https://github.com/LuaJIT/LuaJIT.git 659a61693aa3b87661864ad0f12eee14c865cd7f
          git checkout -q FETCH_HEAD
          make -j"$(nproc)" PREFIX="$prefix" > /dev/null
          make install PREFIX="$prefix" > /dev/null
          echo "$prefix/bin" >> "$GITHUB_PATH"
      - name: lua-language-server 3.19.2, and Renoise's API 6.2 definitions
        if: steps.affected.outputs.renoise_tool == 'true'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o luals.tar.gz https://github.com/LuaLS/lua-language-server/releases/download/3.19.2/lua-language-server-3.19.2-linux-x64.tar.gz
          echo "93ad326b10f6c00911dd8c450fa098332dbd8f9f45d1052f5636a2d54479b947  luals.tar.gz" | sha256sum -c -
          mkdir luals
          tar -xzf luals.tar.gz -C luals
          mkdir definitions
          cd definitions
          git init -q
          git fetch -q --depth 1 https://github.com/renoise/definitions.git 08faaea744156f2f7eddc898eb46fd972453a1af
          git checkout -q FETCH_HEAD
          echo "$RUNNER_TEMP/luals/bin" >> "$GITHUB_PATH"
          echo "RENOISE_DEFINITIONS=$RUNNER_TEMP/definitions/library" >> "$GITHUB_ENV"
      - name: The Renoise tool's tests and the type check (a missing lua-language-server fails)
        if: steps.affected.outputs.renoise_tool == 'true'
        env:
          KUMI_REQUIRE_LUALS: "1"
        run: sh daws/renoise/tests/run.sh

  reaper-extension:
    # The extension as it ships: the release build, unstripped by rustc (a rustc strip can misalign its LINKEDIT string
    # pool on macOS 27, and dyld then refuses it), then the platform's own strip; checked as the release script checks
    # what a bundle carries, and loaded by the system's loader with REAPER's entry point found. A pull request that changes
    # it builds it on Linux, on the Ubuntu the bundles build on (whose glibc is the one the extension may need); main and a
    # run by hand build it on each system.
    name: REAPER extension loads / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-22.04"]' || '["macos-15", "ubuntu-22.04", "windows-2025"]') }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Stop Windows Defender scanning the workspace
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      # (Ubuntu 22.04's own Python is older than dev.py's 3.11)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24)
        with:
          python-version: "3.13"
      - id: affected
        run: python scripts/dev.py affected ${KUMI_BASE:+--base "$KUMI_BASE"} --github-output
      - if: steps.affected.outputs.reaper_extension == 'true'
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - if: steps.affected.outputs.reaper_extension == 'true'
        uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          key: reaper-extension
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build it as it ships, and strip it with the platform's strip
        if: steps.affected.outputs.reaper_extension == 'true'
        run: |
          # Windows links the C runtime statically, so REAPER needs no VC++ runtime installed.
          if [[ "$RUNNER_OS" == "Windows" ]]; then export RUSTFLAGS="-C target-feature=+crt-static"; fi
          cargo build -p reaper-kumi --release --locked
          case "$RUNNER_OS" in
            macOS) file=target/release/libreaper_kumi.dylib; strip -x "$file" ;;
            Linux) file=target/release/libreaper_kumi.so; strip --strip-unneeded "$file" ;;
            Windows) file=target/release/reaper_kumi.dll ;;
          esac
          echo "REAPER_KUMI_ARTIFACT=$PWD/$file" >> "$GITHUB_ENV"
      - name: It's what a bundle may carry (REAPER's entry point; signed and named for itself on macOS; the C runtime linked in on Windows; no newer glibc than Kumi's on Linux)
        if: steps.affected.outputs.reaper_extension == 'true'
        run: |
          python scripts/build-native-release.py --check-extension "$REAPER_KUMI_ARTIFACT" --target "$(rustc -vV | sed -n 's/^host: //p')" --thin
      - name: It loads, with REAPER's entry point
        if: steps.affected.outputs.reaper_extension == 'true'
        run: cargo test -p reaper-kumi --locked --test it -- "loads::"
      # REAPER calls the extension through the C++ shim's vtable, laid out by each platform's C++ ABI.
      - name: REAPER's calls through the shim's vtable reach Rust
        if: steps.affected.outputs.reaper_extension == 'true'
        run: cargo test -p reaper-kumi --locked --lib csurf::tests

  required:
    # The check a pull request waits on, with Willington files. On a pull request: the Linux jobs above passed (each passes
    # at once when the change gives it nothing to test), and the other systems' jobs below were skipped. Everywhere else
    # (main after a merge, a run by hand): every job passed, on every system, so a by-hand run's Required CI means the
    # branch passed on Linux, macOS and Windows.
    name: Required CI
    if: always()
    needs: [rust-linux, rust-lint, checks, reaper-extension, rust-macos, rust-windows, remote-script-platforms]
    runs-on: ubuntu-24.04
    steps:
      - name: Every job passed
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -eu
          for result in "${{ needs.rust-linux.result }}" "${{ needs.rust-lint.result }}" "${{ needs.checks.result }}" \
            "${{ needs.reaper-extension.result }}"; do
            test "$result" = success
          done
          for result in "${{ needs.rust-macos.result }}" "${{ needs.rust-windows.result }}" \
            "${{ needs.remote-script-platforms.result }}"; do
            if [ "$EVENT" = pull_request ]; then test "$result" = skipped; else test "$result" = success; fi
          done

  rust-macos:
    # What differs by platform (the `ci-os` set in .config/nextest.toml): installing, launching and updating; the terminal
    # and stdin; Hands; paths, files and child processes; the store. Built only for the test binaries the set takes in.
    name: Rust / macOS
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 10
    env:
      # The workspace's crates from sccache (see Rust / Linux; the steps that compile set RUSTC_WRAPPER).
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: ${{ github.ref == 'refs/heads/main' && 'READ_WRITE' || 'READ_ONLY' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: affected
        run: python3 scripts/dev.py affected --github-output
      - id: part
        env:
          AFFECTED: ${{ steps.affected.outputs.packages }}
        run: |
          picked="$(python3 scripts/dev.py select --tested-by ci-os "$AFFECTED")"
          echo "picked=$picked" | tee -a "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0
      # Saved from main only, by name (see Rust / Linux).
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          shared-key: rust-platforms
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: nextest
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: The tests, in a home of their own
        env:
          RUSTC_WRAPPER: sccache
          KUMI_NEXTEST: "1"
          KUMI_NEXTEST_LIST: ${{ runner.temp }}/nextest-list.json
          # Only the test binaries the profile names are built.
          KUMI_NEXTEST_BUILD_PROFILE: ci-os
        # (word splitting on purpose: the -p options)
        run: sh scripts/test-isolated.sh --profile ci-os ${{ steps.part.outputs.picked }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: nextest-list-ci-os-macOS
          path: ${{ runner.temp }}/nextest-list.json
          if-no-files-found: ignore
          retention-days: 14

  rust-windows:
    # The `ci-os` set on Windows, in two parts at once of about the same test time: the app's tests, and the rest. The
    # slowest there (9 to 16 s each: the bridges' update and rollback, the library worker, Willington's receipt) are
    # Extended's (KUMI_WINDOWS_EXTENDED_ONLY).
    name: Rust / ${{ matrix.label }}
    if: github.event_name != 'pull_request'
    runs-on: windows-2025
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: Windows, part: app, crates: "-p kumi" }
          - { label: "Windows (Kumi's crates and bridges)", part: rest, crates: "--exclude kumi" }
    env:
      # Rust's own linker: Microsoft's is a large part of linking the test binaries.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld
      # The workspace's crates from sccache (see Rust / Linux; the steps that compile set RUSTC_WRAPPER).
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: ${{ github.ref == 'refs/heads/main' && 'READ_WRITE' || 'READ_ONLY' }}
      KUMI_WINDOWS_EXTENDED_ONLY: >-
        (binary_id(kumi::it) & test(=own_providers::an_update_keeps_the_bridges_in_place_and_a_rollback_takes_each_to_the_copy_its_kumi_carries))
        | (binary_id(kumi::it) & test(=own_providers::reapers_and_renoises_bridge_messages_never_speak_lives_words))
        | (binary_id(kumi::it) & test(=own_providers::an_update_follows_each_copy_and_never_puts_back_a_bridge_taken_out_or_moves_it_to_another_reaper))
        | (binary_id(kumi::it) & test(=own_providers::a_kumi_an_earlier_updater_put_in_place_brings_its_bridge_as_it_starts))
        | (binary_id(kumi::it) & test(=library_learn::a_stopped_worker_takes_what_it_started_and_its_temporary_files_with_it_on_windows))
        | (binary_id(kumi::it) & test(=willington::native_editing_requires_an_owner_only_receipt_for_the_loaded_package))
    steps:
      - name: Stop Windows Defender scanning the workspace (it slows every file the build touches)
        continue-on-error: true
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The set's packages in this part (everything: main's pushes and runs by hand test all of them).
      - id: part
        shell: pwsh
        run: |
          $affected = (python scripts/dev.py affected --json | ConvertFrom-Json).packages -join ' '
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $picked = python scripts/dev.py select --tested-by ci-os $affected ${{ matrix.crates }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "picked=$picked" | Tee-Object -Append -FilePath $env:GITHUB_OUTPUT
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0
      # Saved from main only, by name (see Rust / Linux). Each part keeps its own: they build some crates from crates.io
      # differently (cargo unifies their features over the packages a build selects).
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          shared-key: ${{ matrix.part }}-rust-windows
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: nextest
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: The tests, in a home of their own (Windows)
        shell: pwsh
        env:
          RUSTC_WRAPPER: sccache
          KUMI_NEXTEST: "1"
          KUMI_NEXTEST_LIST: ${{ runner.temp }}/nextest-list.json
          KUMI_NEXTEST_BUILD_PROFILE: ci-os
          RUST_TEST_NOCAPTURE: '1'
        # (the -p options as separate words: the expression is replaced before PowerShell reads the line)
        run: ./scripts/test-isolated.ps1 --profile ci-os -E "not ($env:KUMI_WINDOWS_EXTENDED_ONLY)" ${{ steps.part.outputs.picked }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: nextest-list-ci-os-Windows-${{ matrix.part }}
          path: ${{ runner.temp }}/nextest-list.json
          if-no-files-found: ignore
          retention-days: 14

  remote-script-platforms:
    # The Remote Script's tests on the Python of Live's other systems (Linux's run in Checks).
    name: Python Remote Script / ${{ matrix.os }}
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    defaults:
      run:
        shell: bash
        working-directory: daws/ableton/remote-script
    steps:
      - name: Stop Windows Defender scanning the workspace
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24)
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s . -p 'test_*.py'
      - run: python -m compileall -q AbletonMcpBridge

  main-failed:
    # macOS and Windows first test a change once it's on main, and a release waits for main's CI on all three systems: a
    # red run there opens an issue (or comments on the open one), naming the commit, for whoever broke it to fix first.
    name: Main's CI failed
    needs: [required]
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # One at a time, so two red runs close together comment on one issue instead of opening two.
    concurrency:
      group: main-ci-failed
      cancel-in-progress: false
    permissions:
      issues: write
    steps:
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          title="Main's CI failed"
          body="CI failed on main at $SHA (${MESSAGE%%$'\n'*}): $RUN. macOS and Windows test a change only once it's on main, and no release goes out until main's CI is green on all three systems, so this comes first."
          open="$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")"
          if [ -n "$open" ]; then
            gh issue comment "$open" -R "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "$body" --label bug --label critical
          fi
