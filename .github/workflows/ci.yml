name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A merge queue's run of a pull request on top of main checks it as the pull request's own run does.
  # Nothing triggers it until the repository has a merge queue.
  merge_group:
  schedule:
    # Every test on every platform each night, besides each push to main.
    - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  # A pull request's newer push replaces its run. Every other run (each push to main, a tag, the nightly)
  # has a group of its own, so a newer one can't cancel it while it waits for a runner.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Tests need no debug info or incremental artifacts: linking and the build cache stay small.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.paths.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          fetch-depth: 0
      - id: paths
        shell: bash
        run: |
          # A pull request that changes only documentation skips the builds; main and the nightly run build everything.
          case "${{ github.event_name }}" in
            pull_request) base="origin/${GITHUB_BASE_REF}" ;;
            merge_group) base="${{ github.event.merge_group.base_sha }}" ;;
            *) base= ;;
          esac
          # Read whole, then searched: grep -q can close a pipe early, and git, still writing, fails under pipefail.
          if [[ -n "$base" ]]; then changed="$(git diff --name-only "$base...HEAD")"; fi
          if [[ -z "$base" ]] || grep -q -v -E '^$|^(docs/|LICENSE)|\.md$' <<<"$changed"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  rust-linux:
    name: Rust / Linux
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: nextest
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/kumi-runtime/tests/support/package-lock.json
      - name: Install the official MCP and model SDKs the interoperability tests run beside Kumi's
        run: npm ci --prefix crates/kumi-runtime/tests/support --ignore-scripts
      - name: The published Kumi 1.7.5, fetched once for the migration tests
        shell: bash
        run: |
          python="$(command -v python3 || command -v python)"
          echo "KUMI_LEGACY_APP=$("$python" scripts/fetch-legacy-release.py "$RUNNER_TEMP/kumi-1.7.5")" >> "$GITHUB_ENV"
      # The video tests skip without ffmpeg. This is the build Kumi itself fetches on Linux (BtbN's newest
      # numbered LGPL one), at 8.1 or later, which asks for a stream in pieces (-request_size) as YouTube wants.
      - name: ffmpeg, for the video tests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release=repos/BtbN/FFmpeg-Builds/releases/latest
          asset="$(gh api "$release" --jq '.assets[].name' | grep -E '^ffmpeg-n[0-9]+\.[0-9]+-latest-linux64-lgpl-[0-9]+\.[0-9]+\.tar\.xz$' | sort -V | tail -1)"
          from="https://github.com/BtbN/FFmpeg-Builds/releases/download/$(gh api "$release" --jq .tag_name)"
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o "$asset" "$from/$asset"
          curl -fsSL --retry 3 "$from/checksums.sha256" | grep -F "  $asset" | sha256sum -c -
          tar -xJf "$asset"
          bin="$RUNNER_TEMP/${asset%.tar.xz}/bin"
          # Read whole, then searched: a pipe into grep -q can close early, and ffmpeg, still writing, fails under pipefail.
          help="$("$bin/ffmpeg" -hide_banner -h protocol=http)"
          grep -q -- -request_size <<<"$help"
          "$bin/ffmpeg" -version | sed -n 1p
          echo "$bin" >> "$GITHUB_PATH"
      - run: cargo fmt --all --check
      - name: Every test, in a home of their own (no test reaches this machine's Live folders or ~/.kumi)
        env:
          KUMI_NEXTEST: "1"
        run: sh scripts/test-isolated.sh --no-fail-fast
      - name: Documentation tests and examples
        run: |
          cargo test --workspace --locked --doc
          cargo check --workspace --locked --examples
      # Everything runs on one thread with Rc<RefCell<…>>: a borrow held across an await panics when another
      # task borrows the same cell meanwhile. The rest of clippy stays advisory for now.
      - name: No RefCell borrow held across an await
        run: cargo clippy --workspace --lib --bins --examples --locked -- -A clippy::all -D clippy::await_holding_refcell_ref
      - name: Clippy (advisory while the port is under way)
        continue-on-error: true
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: git diff --check

  rust-platforms:
    name: Rust / ${{ matrix.label }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, label: macOS }
          - { os: windows-2025, label: Windows }
    timeout-minutes: 45
    env:
      # Rust's own linker: Microsoft's is a large part of linking two hundred test binaries.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld
    steps:
      - name: Stop Windows Defender scanning the workspace (it slows every file the build touches)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: nextest
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/kumi-runtime/tests/support/package-lock.json
      - name: Install the official MCP and model SDKs the interoperability tests run beside Kumi's
        run: npm ci --prefix crates/kumi-runtime/tests/support --ignore-scripts
      - name: The published Kumi 1.7.5, fetched once for the migration tests
        shell: bash
        run: |
          python="$(command -v python3 || command -v python)"
          echo "KUMI_LEGACY_APP=$("$python" scripts/fetch-legacy-release.py "$RUNNER_TEMP/kumi-1.7.5")" >> "$GITHUB_ENV"
      - name: Windows input regressions
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RUST_TEST_NOCAPTURE: '1'
        run: ./scripts/test-isolated.ps1 --test stdin_handoff --test windows_console_control --test windows_stdin --test windows_tty --no-fail-fast
      # Temporary (#204): the console tests again and again, under cargo test and nextest, for evidence.
      - name: Console tests, 20 times each way (temporary, #204)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        env:
          RUST_TEST_NOCAPTURE: '1'
        run: |
          $ErrorActionPreference = 'Continue'
          foreach ($way in 'cargo test', 'nextest') {
            $env:KUMI_NEXTEST = if ($way -eq 'nextest') { '1' } else { '' }
            [string[]]$extra = @('--no-fail-fast')
            $failed = 0
            for ($i = 1; $i -le 20; $i++) {
              $out = (& ./scripts/test-isolated.ps1 --test windows_stdin --test windows_tty --test windows_console_control @extra 2>&1 | Out-String)
              $code = $LASTEXITCODE
              if ($code -ne 0) { $failed++ }
              foreach ($line in ($out -split "`n")) {
                if ($line -match 'panicked at|queued keys|FAIL \[|\.\.\. FAILED|Summary \[|^test result') { Write-Host "[$way $i] $($line.Trim())" }
              }
              if ($code -ne 0) { ($out -split "`n" | Select-Object -Last 8) | ForEach-Object { Write-Host "[$way $i tail] $_" } }
            }
            Write-Host "== ${way}: $failed of 20 runs failed"
          }
      - name: Choose the tests
        shell: bash
        run: |
          # A pull request runs what differs by platform, beside every test on Linux: installing, launching and
          # updating; the terminal and stdin; Hands; paths, files and child processes; and a few smoke tests.
          # main and the nightly run take every test.
          if [[ "${{ github.event_name }}" == "pull_request" || "${{ github.event_name }}" == "merge_group" ]]; then
            tests="install cli_binary cli update bridge_setup doctor live_extension report login config history library stdin_handoff terminal tui voice_input"
            tests+=" hands_transport mcp auth system disk samples project_runtime library_files library_learn library_state_plan voice video local_servers session agent"
            tests+=" lifecycle lifecycle_migration lifecycle_release delivery delivery_cli extension_launcher extension_channel stdio fixture_paths project host_probes analysis_runner sqlite_reader tool_catalog"
            tests+=" native_connected remote_adapter loopback ai_transport store willington"
            echo "KUMI_TESTS=$(printf -- '--test %s ' $tests)" >> "$GITHUB_ENV"
          fi
      - name: Every test and example compiles here (checked, not linked), beside the tests that run
        run: cargo check --workspace --all-targets --locked
      - name: Tests, in a home of their own
        if: runner.os != 'Windows'
        env:
          KUMI_NEXTEST: "1"
        run: sh scripts/test-isolated.sh --no-fail-fast $KUMI_TESTS
      - name: Tests, in a home of their own (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          KUMI_NEXTEST: "1"
        run: |
          $tests = if ($env:KUMI_TESTS) { $env:KUMI_TESTS.Trim() -split ' +' } else { @() }
          ./scripts/test-isolated.ps1 --no-fail-fast @tests

  remote-script:
    name: Python Remote Script / ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # A pull request's run on macOS waited longest for a runner, for under a minute's work; main and the nightly
        # run it there too.
        os: ${{ fromJSON((github.event_name == 'pull_request' || github.event_name == 'merge_group') && '["ubuntu-24.04", "windows-2025"]' || '["ubuntu-24.04", "macos-15", "windows-2025"]') }}
    defaults:
      run:
        shell: bash
        working-directory: remote-script
    steps:
      - name: Stop Windows Defender scanning the workspace
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24)
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s . -p 'test_*.py'
      - run: python -m compileall -q AbletonMcpBridge

  live-extension:
    # Its type check needs the Ableton Extensions SDK, which can't be redistributed; the tests run Live fakes.
    name: Live extension
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/live-extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (Node 24)
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/live-extension/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test

  scripts:
    name: Release scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          fetch-depth: 0
      - name: Check committed whitespace in this change
        shell: bash
        run: |
          case "${{ github.event_name }}" in
            pull_request) git diff --check "origin/${GITHUB_BASE_REF}...HEAD" ;;
            merge_group) git diff --check "${{ github.event.merge_group.base_sha }}...HEAD" ;;
            *) git diff-tree --check --no-commit-id -r HEAD ;;
          esac
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24)
        with:
          python-version: "3.13"
      - name: Native release packaging (and every packaged document's links)
        run: python3 -m unittest discover -s scripts/tests -p test_native_release.py

  required:
    name: Required CI
    if: always()
    needs: [changes, rust-linux, rust-platforms, remote-script, live-extension, scripts]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every job above (the builds may skip a documentation-only change)
        shell: bash
        run: |
          set -euo pipefail
          test "${{ needs.changes.result }}" = "success"
          test "${{ needs.scripts.result }}" = "success"
          ok() { [[ "$1" == "success" || ( "$1" == "skipped" && "${{ needs.changes.outputs.code }}" == "false" ) ]]; }
          ok "${{ needs.rust-linux.result }}"
          ok "${{ needs.rust-platforms.result }}"
          ok "${{ needs.remote-script.result }}"
          ok "${{ needs.live-extension.result }}"
