name: CodeQL

# Code scanning for the languages CodeQL reads here: the Live extension's TypeScript and JavaScript and the map page's
# inline scripts, the Hermes plugin's Python and TypeScript, the Remote Script's and the scripts' Python, REAPER's C++
# shim and SDK headers, and the workflows themselves. Each language's analysis is the repository's former default
# setup's (build-mode none, the default queries, its category), so its alerts carry on. It runs on main only after a
# change to one of those, and each Monday over all of them, which brings new queries to unchanged code; never on a pull
# request, which runs only Required CI (AGENTS.md, "Minimal CI"). The default setup it replaces ran all four on every
# push.

on:
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "**/*.js"
      - "**/*.mjs"
      - "**/*.cjs"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.html"
      - "**/*.c"
      - "**/*.cc"
      - "**/*.cpp"
      - "**/*.h"
      - "**/*.hpp"
      - ".github/workflows/**"
  schedule:
    - cron: "41 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, c-cpp, javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
