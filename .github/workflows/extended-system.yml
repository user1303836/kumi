name: Extended system

# One system's part of the Extended workflow, which calls it for Linux, macOS and Windows: the system's tests built once and
# archived (`cargo nextest archive`), then run in shares from the archive. Each system's shares start when its own build
# is done, whatever the others' builds are doing (a macOS runner can be a long wait).

on:
  workflow_call:
    inputs:
      os:
        type: string
        required: true
      label:
        type: string
        required: true
      # The rust-cache CI saves from main for this system, which the build restores.
      cache:
        type: string
        required: true
      linker:
        type: string
        default: ""
      # The shares, as a JSON list of their numbers ("[1, 2, 3]").
      parts:
        type: string
        required: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  build:
    # One build of the workspace (5 to 7 minutes; 14 after a release, whose version bump changes every crate), where each
    # share used to build it whole. The archive holds the test binaries and the workspace's programs and libraries they
    # run beside them; the shares unpack it into their checkout's target/, as it was here.
    name: build
    runs-on: ${{ inputs.os }}
    timeout-minutes: 30
    env:
      # Rust's own linker on Windows, as CI's Windows jobs have it, and empty elsewhere: rust-cache keys a cache on the
      # CARGO* and RUST* variables that are set, so one that CI's Linux and macOS jobs don't set misses their caches.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: ${{ inputs.linker }}
    steps:
      - name: Stop Windows Defender scanning the workspace (it slows every file the build touches)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      # Restores the cache CI saves from main for this platform, by its name; saves none of its own, so the repository's
      # 10 GB keeps main's. On Windows the app's: it builds its crates from crates.io with the features every test gives
      # them, where the other part builds windows-sys with others, and every crate above it would build again.
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          shared-key: ${{ inputs.cache }}
          save-if: false
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: nextest
      - name: Every test, built and archived
        run: cargo nextest archive --workspace --locked --archive-file nextest-archive.tar.zst
      # Kept a day: the shares take it at once. Already compressed, so it goes up as it is.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extended-tests-${{ inputs.label }}
          path: nextest-archive.tar.zst
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  tests:
    # A share of the system's tests, run from its build's archive.
    name: (${{ matrix.part }}/${{ strategy.job-total }})
    needs: build
    runs-on: ${{ inputs.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(inputs.parts) }}
    steps:
      - name: Stop Windows Defender scanning the workspace (it slows every file the tests write)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # rustc, which the update tests build a stand-in Kumi with, and cargo to run nextest.
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: nextest
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: extended-tests-${{ inputs.label }}
          path: ${{ runner.temp }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/kumi-agent/tests/support/package-lock.json
      - name: Install the official MCP and model SDKs the interoperability tests run beside Kumi's
        run: npm ci --prefix crates/kumi-agent/tests/support --ignore-scripts
      - name: The published Kumi 1.7.5, fetched once for the migration tests
        shell: bash
        run: |
          python="$(command -v python3 || command -v python)"
          echo "KUMI_LEGACY_APP=$("$python" scripts/fetch-legacy-release.py "$RUNNER_TEMP/kumi-1.7.5")" >> "$GITHUB_ENV"
      # The video tests skip without ffmpeg. This is the build Kumi itself fetches on Linux (BtbN's newest
      # numbered LGPL one), at 8.1 or later, which asks for a stream in pieces (-request_size) as YouTube wants.
      # It's read from the release tagged latest, not releases/latest: each day's dated build (about 13:07Z) is
      # releases/latest until BtbN makes latest again from it about 20 minutes later, and its names have no
      # "-latest-". While latest is made again (deleted, then uploaded anew), the newest dated build serves.
      - name: ffmpeg, for the video tests
        if: runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP"
          # The tagged release's newest numbered build, into $asset, checked against that release's checksums.
          # A function tested with || runs without set -e, hence its own || return and &&.
          fetch() {
            local from="https://github.com/BtbN/FFmpeg-Builds/releases/download/$1" names
            names="$(gh api "repos/BtbN/FFmpeg-Builds/releases/tags/$1" --jq '.assets[].name')" || return
            asset="$(grep -E '^ffmpeg-n[0-9]+\.[0-9.]+(-latest|-[0-9]+-g[0-9a-f]+)?-linux64-lgpl-[0-9]+\.[0-9]+\.tar\.xz$' <<<"$names" | sort -V | tail -1)" || return
            curl -fsSL --retry 3 -o "$asset" "$from/$asset" &&
              curl -fsSL --retry 3 "$from/checksums.sha256" | grep -F "  $asset" | sha256sum -c -
          }
          newest_dated() { gh api 'repos/BtbN/FFmpeg-Builds/releases?per_page=10' --jq '[.[].tag_name | select(startswith("autobuild-"))] | max'; }
          fetch latest || fetch "$(newest_dated)"
          tar -xJf "$asset"
          bin="$RUNNER_TEMP/${asset%.tar.xz}/bin"
          # Read whole, then searched: a pipe into grep -q can close early, and ffmpeg, still writing, fails under pipefail.
          help="$("$bin/ffmpeg" -hide_banner -h protocol=http)"
          grep -q -- -request_size <<<"$help"
          "$bin/ffmpeg" -version | sed -n 1p
          echo "$bin" >> "$GITHUB_PATH"
      - name: Every test, a share of them, in a home of their own
        if: runner.os != 'Windows'
        env:
          KUMI_NEXTEST: "1"
          KUMI_NEXTEST_ARCHIVE: ${{ runner.temp }}/nextest-archive.tar.zst
          KUMI_NEXTEST_LIST: ${{ runner.temp }}/nextest-list.json
        run: sh scripts/test-isolated.sh --profile extended --partition hash:${{ matrix.part }}/${{ strategy.job-total }}
      - name: Every test, a share of them, in a home of their own (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          KUMI_NEXTEST: "1"
          KUMI_NEXTEST_ARCHIVE: ${{ runner.temp }}/nextest-archive.tar.zst
          KUMI_NEXTEST_LIST: ${{ runner.temp }}/nextest-list.json
          RUST_TEST_NOCAPTURE: '1'
        run: ./scripts/test-isolated.ps1 --profile extended --partition 'hash:${{ matrix.part }}/${{ strategy.job-total }}'
      # The tests this share selected (`cargo nextest list`), to compare one run's with another's.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: nextest-list-extended-${{ inputs.label }}-${{ matrix.part }}
          path: ${{ runner.temp }}/nextest-list.json
          if-no-files-found: ignore
          retention-days: 14
