name: Extended

# Every test, on every system: what the pull requests' gate (CI's `ci` set in .config/nextest.toml) leaves out, in the
# `extended` set: the recorded-source oracles, the long listening, form and rendering simulations, the video tests (with
# ffmpeg), the interoperability tests beside the official MCP and model SDKs (from npm), the migration from the published
# Kumi 1.7.5, the long sweeps of the timing building blocks, and each system's every test. It blocks nothing and runs on
# no pull request (AGENTS.md, "Minimal CI"): each week on main, and by hand on any branch (Actions > Extended > Run
# workflow, or `gh workflow run Extended --ref <branch>`).

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A run by hand replaces one still under way on its branch; the weekly run keeps its own, so neither cancels the other.
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && github.run_id || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  systems:
    # Each system's tests built once and run in shares from the archive (extended-system.yml): a system's shares start
    # when its own build is done. A share runs about ten minutes after its system's build.
    name: Extended / ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, label: Linux, cache: kumi-rust-linux, parts: "[1, 2]" }
          - { os: macos-15, label: macOS, cache: rust-platforms, parts: "[1, 2]" }
          - { os: windows-2025, label: Windows, cache: app-rust-windows, linker: rust-lld, parts: "[1, 2, 3]" }
    uses: ./.github/workflows/extended-system.yml
    with:
      os: ${{ matrix.os }}
      label: ${{ matrix.label }}
      cache: ${{ matrix.cache }}
      linker: ${{ matrix.linker || '' }}
      parts: ${{ matrix.parts }}

  eval-runner:
    # The eval runner's own tests (its lab guard, which refuses a producer's real project or ~/.kumi, and that its
    # Live-words and names checks can fail): an example's tests, which no test binary holds, so nextest never runs them.
    name: Extended / eval runner tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      # CI's, as the tests'.
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          shared-key: kumi-rust-linux
          save-if: false
      - run: cargo test -p kumi --locked --example eval_daws
