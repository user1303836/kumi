name: Extended

# Every test, on every platform: what the CI workflow's blocking runs leave out (the `extended` set in
# .config/nextest.toml): the recorded-source oracles, the long listening, form and rendering simulations, the video
# tests (with ffmpeg), the benchmarks, the interoperability tests beside the official MCP and model SDKs (from npm), the
# migration from the published Kumi 1.7.5, the long sweeps of the timing building blocks, each platform's every test,
# the documentation tests, the eval runner's own tests, and REAPER's extension built against the newest SDK header Cockos
# has published. It blocks nothing: it runs each week, by hand, and on a pull request labelled full-tests (from the push
# after the label is added, and when it is added).

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  tests:
    # Shards, so that no runner takes more than about ten minutes.
    name: Extended / ${{ matrix.label }} (${{ matrix.part }}/${{ matrix.parts }})
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-tests')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, label: Linux, part: 1, parts: 3 }
          - { os: ubuntu-24.04, label: Linux, part: 2, parts: 3 }
          - { os: ubuntu-24.04, label: Linux, part: 3, parts: 3 }
          - { os: macos-15, label: macOS, part: 1, parts: 2 }
          - { os: macos-15, label: macOS, part: 2, parts: 2 }
          # (Windows runs the slowest: three shards took 12, 18 and 20 minutes, the last at its limit)
          - { os: windows-2025, label: Windows, part: 1, parts: 4 }
          - { os: windows-2025, label: Windows, part: 2, parts: 4 }
          - { os: windows-2025, label: Windows, part: 3, parts: 4 }
          - { os: windows-2025, label: Windows, part: 4, parts: 4 }
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld
    steps:
      - name: Stop Windows Defender scanning the workspace (it slows every file the build touches)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      # Restores main's cache (CI saves it); saves none of its own, so the repository's 10 GB keeps main's.
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          save-if: false
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: nextest
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/kumi-runtime/tests/support/package-lock.json
      - name: Install the official MCP and model SDKs the interoperability tests run beside Kumi's
        run: npm ci --prefix crates/kumi-runtime/tests/support --ignore-scripts
      - name: The published Kumi 1.7.5, fetched once for the migration tests
        shell: bash
        run: |
          python="$(command -v python3 || command -v python)"
          echo "KUMI_LEGACY_APP=$("$python" scripts/fetch-legacy-release.py "$RUNNER_TEMP/kumi-1.7.5")" >> "$GITHUB_ENV"
      # The video tests skip without ffmpeg. This is the build Kumi itself fetches on Linux (BtbN's newest
      # numbered LGPL one), at 8.1 or later, which asks for a stream in pieces (-request_size) as YouTube wants.
      # It's read from the release tagged latest, not releases/latest: each day's dated build (about 13:07Z) is
      # releases/latest until BtbN makes latest again from it about 20 minutes later, and its names have no
      # "-latest-". While latest is made again (deleted, then uploaded anew), the newest dated build serves.
      - name: ffmpeg, for the video tests
        if: runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP"
          # The tagged release's newest numbered build, into $asset, checked against that release's checksums.
          # A function tested with || runs without set -e, hence its own || return and &&.
          fetch() {
            local from="https://github.com/BtbN/FFmpeg-Builds/releases/download/$1" names
            names="$(gh api "repos/BtbN/FFmpeg-Builds/releases/tags/$1" --jq '.assets[].name')" || return
            asset="$(grep -E '^ffmpeg-n[0-9]+\.[0-9.]+(-latest|-[0-9]+-g[0-9a-f]+)?-linux64-lgpl-[0-9]+\.[0-9]+\.tar\.xz$' <<<"$names" | sort -V | tail -1)" || return
            curl -fsSL --retry 3 -o "$asset" "$from/$asset" &&
              curl -fsSL --retry 3 "$from/checksums.sha256" | grep -F "  $asset" | sha256sum -c -
          }
          newest_dated() { gh api 'repos/BtbN/FFmpeg-Builds/releases?per_page=10' --jq '[.[].tag_name | select(startswith("autobuild-"))] | max'; }
          fetch latest || fetch "$(newest_dated)"
          tar -xJf "$asset"
          bin="$RUNNER_TEMP/${asset%.tar.xz}/bin"
          # Read whole, then searched: a pipe into grep -q can close early, and ffmpeg, still writing, fails under pipefail.
          help="$("$bin/ffmpeg" -hide_banner -h protocol=http)"
          grep -q -- -request_size <<<"$help"
          "$bin/ffmpeg" -version | sed -n 1p
          echo "$bin" >> "$GITHUB_PATH"
      - name: Every test, a share of them, in a home of their own
        if: runner.os != 'Windows'
        env:
          KUMI_NEXTEST: "1"
          KUMI_NEXTEST_LIST: ${{ runner.temp }}/nextest-list.json
        run: sh scripts/test-isolated.sh --profile extended --partition hash:${{ matrix.part }}/${{ matrix.parts }}
      - name: Every test, a share of them, in a home of their own (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          KUMI_NEXTEST: "1"
          KUMI_NEXTEST_LIST: ${{ runner.temp }}/nextest-list.json
          RUST_TEST_NOCAPTURE: '1'
        run: ./scripts/test-isolated.ps1 --profile extended --partition 'hash:${{ matrix.part }}/${{ matrix.parts }}'
      # The tests this share selected (`cargo nextest list`), to compare one run's with another's.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: nextest-list-extended-${{ matrix.label }}-${{ matrix.part }}
          path: ${{ runner.temp }}/nextest-list.json
          if-no-files-found: ignore
          retention-days: 14

  docs:
    name: Extended / documentation and eval runner tests
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-tests')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          save-if: false
      - run: cargo test --workspace --locked --doc
      # The eval runner's own tests (its lab guard, and that its Live-words and names checks can fail): an example's tests,
      # which no test binary holds.
      - run: cargo test -p kumi --locked --example eval_daws

  reaper-sdk:
    # REAPER's newest SDK headers, from Cockos' repository, in place of the vendored ones: build.rs generates every
    # function they declare (a prototype it can't read fails the build by name, as does a change to the control surface's
    # virtual functions), the extension builds against them, and the generated table is the header's every function. The
    # summary lists the functions a move to them would bring. Here and not in CI: it follows another repository's newest
    # commit, which no pull request should wait on.
    name: Extended / REAPER SDK, newest header
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-tests')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          save-if: false
      - name: The newest SDK headers, and the functions they add, take away or change
        id: sdk
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --depth 1 https://github.com/justinfrankel/reaper-sdk "$RUNNER_TEMP/reaper-sdk"
          newest="$RUNNER_TEMP/reaper-sdk/sdk" vendored=daws/reaper/reaper-kumi/sdk
          # Every function a header declares, by its loader table's names; and each one's prototype, spaces folded.
          names() { grep -o '{(void\*\*)&REAPERAPI_FUNCNAME([A-Za-z0-9_]*)' "$1/reaper_plugin_functions.h" | sed 's/.*(//; s/)$//' | LC_ALL=C sort; }
          protos() { grep -E '\(\*REAPERAPI_FUNCNAME\([A-Za-z0-9_]+\)\)\(' "$1/reaper_plugin_functions.h" | sed -E 's/^[[:space:]]+//; s/[[:space:]]+/ /g' | LC_ALL=C sort -u; }
          made_by() { grep -m 1 -o 'Generated by REAPER v[^ ]*' "$1/reaper_plugin_functions.h"; }
          new="$(LC_ALL=C comm -13 <(names "$vendored") <(names "$newest") | xargs echo)"
          gone="$(LC_ALL=C comm -23 <(names "$vendored") <(names "$newest") | xargs echo)"
          # A function in both whose prototype differs: what the extension calls may now take or give other types.
          changed="$(LC_ALL=C comm -13 <(protos "$vendored") <(protos "$newest") | sed -E 's/.*REAPERAPI_FUNCNAME\(([A-Za-z0-9_]+)\).*/\1/' \
            | LC_ALL=C sort -u | LC_ALL=C comm -12 - <(LC_ALL=C comm -12 <(names "$vendored") <(names "$newest")) | xargs echo)"
          {
            echo "### REAPER SDK: $(git -C "$RUNNER_TEMP/reaper-sdk" log -1 --format='%h "%s" (%cs)')"
            echo "- Vendored: $(made_by "$vendored"), $(names "$vendored" | wc -l | tr -d ' ') functions. Newest: $(made_by "$newest"), $(names "$newest" | wc -l | tr -d ' ') functions."
            echo "- New: $new"
            echo "- Gone: $gone"
            echo "- Changed: $changed"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          # A newer SDK is said where it's seen, not only in the summary: new functions warn; gone or changed ones fail the
          # job (last, once the build and the table below have said what they find).
          if [ -n "$new" ]; then echo "::warning title=REAPER SDK::the newest header adds functions: $new"; fi
          if [ -n "$gone" ]; then echo "::error title=REAPER SDK::the newest header no longer declares: $gone"; fi
          if [ -n "$changed" ]; then echo "::error title=REAPER SDK::the newest header changes the prototypes of: $changed"; fi
          if [ -n "$gone$changed" ]; then echo "breaking=true" >> "$GITHUB_OUTPUT"; fi
          cp "$newest/reaper_plugin_functions.h" "$newest/reaper_plugin.h" "$vendored/"
      - name: The extension builds with them, every function generated
        run: cargo build -p reaper-kumi --locked
      - name: The generated table is the newest header's every function
        run: cargo test -p reaper-kumi --locked --test it -- sdk::the_generated_table_is_the_headers_every_function
      - name: Functions gone or changed in the newest header fail the job (see the summary)
        if: ${{ !cancelled() && steps.sdk.outputs.breaking == 'true' }}
        run: exit 1
