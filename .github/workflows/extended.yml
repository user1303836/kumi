name: Extended

# Every test, on every system: what the pull requests' gate (CI's `ci` set in .config/nextest.toml) leaves out, in the
# `extended` set: the recorded-source oracles, the long listening, form and rendering simulations, the video tests (with
# ffmpeg), the interoperability tests beside the official MCP and model SDKs (from npm), the migration from the published
# Kumi 1.7.5, the long sweeps of the timing building blocks, and each system's every test. It blocks nothing and runs on
# no pull request (AGENTS.md, "Minimal CI"): each week on main, and by hand on any branch (Actions > Extended > Run
# workflow, or `gh workflow run Extended --ref <branch>`).

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  systems:
    # Each system's tests built once and run in shares from the archive (extended-system.yml): a system's shares start
    # when its own build is done. A share runs about ten minutes after its system's build.
    name: Extended / ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, label: Linux, cache: kumi-rust-linux, parts: "[1, 2]" }
          - { os: macos-15, label: macOS, cache: rust-platforms, parts: "[1, 2]" }
          - { os: windows-2025, label: Windows, cache: app-rust-windows, linker: rust-lld, parts: "[1, 2, 3]" }
    uses: ./.github/workflows/extended-system.yml
    with:
      os: ${{ matrix.os }}
      label: ${{ matrix.label }}
      cache: ${{ matrix.cache }}
      linker: ${{ matrix.linker || '' }}
      parts: ${{ matrix.parts }}
