name: FabFilter validation

on:
  pull_request:
    paths:
      - 'crates/kumi-library/**'
      - 'crates/kumi-agent/src/core/plugin_tools.rs'
      - 'plugin-formats/**'
      - '.github/workflows/fabfilter-validation.yml'

permissions:
  contents: read

concurrency:
  group: fabfilter-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  encoder:
    if: github.head_ref == 'feat/fabfilter-vst3'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7
        with:
          shared-key: rust-platforms
          save-if: false
      - name: Build the offline encoder
        run: cargo build --locked -p kumi-library --example preset_probe --target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fabfilter-preset-encoder
          path: target/x86_64-pc-windows-msvc/debug/examples/preset_probe.exe
          if-no-files-found: error
          retention-days: 3

  catalog:
    if: github.head_ref == 'feat/fabfilter-vst3'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        catalog: [current, without-fabfilter, before-compaction]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.catalog == 'before-compaction' && '264afd0907917b244783cf2dce2c5a004d4d4266' || github.event.pull_request.head.sha }}
          path: measured
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7
        with:
          workspaces: measured -> target
          shared-key: rust-release
          save-if: false
      - name: Prepare the measured catalog
        env:
          CATALOG_CASE: ${{ matrix.catalog }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, shutil
          shutil.copyfile('crates/kumi-library/examples/catalog_probe.rs', 'measured/crates/kumi-library/examples/catalog_probe.rs')
          if os.environ['CATALOG_CASE'] == 'without-fabfilter':
              path = pathlib.Path('measured/plugin-formats/catalog.json')
              ids = json.loads(path.read_text())
              path.write_text(json.dumps([item for item in ids if not item.startswith('fabfilter-')]))
          PY
      - name: Build the optimized catalog probe
        working-directory: measured
        run: cargo build --release --locked -p kumi-library --example catalog_probe
      - name: Measure fifteen fresh processes
        working-directory: measured
        env:
          CATALOG_CASE: ${{ matrix.catalog }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, statistics, subprocess
          samples = [json.loads(subprocess.check_output(['target/release/examples/catalog_probe'], text=True)) for _ in range(15)]
          keys = ('first_builtins_ms', 'rss_before_kib', 'rss_after_kib', 'rss_increase_kib')
          summary = {key: {'median': statistics.median(s[key] for s in samples), 'min': min(s[key] for s in samples), 'max': max(s[key] for s in samples)} for key in keys}
          result = {'case': os.environ['CATALOG_CASE'], 'profile': 'release', 'products': samples[0]['products'], 'fields': samples[0]['fields'], 'samples': samples, 'summary': summary}
          pathlib.Path('catalog-benchmark.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps({key: value for key, value in result.items() if key != 'samples'}, indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: catalog-${{ matrix.catalog }}
          path: measured/catalog-benchmark.json
          if-no-files-found: error
          retention-days: 3
