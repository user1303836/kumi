name: FabFilter validation encoder

on:
  pull_request:
    paths:
      - 'crates/kumi-library/**'
      - 'plugin-formats/**'
      - '.github/workflows/fabfilter-validation.yml'

permissions:
  contents: read

concurrency:
  group: fabfilter-encoder-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  encoder:
    if: github.head_ref == 'feat/fabfilter-vst3'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7
        with:
          shared-key: rust-platforms
          save-if: false
      - name: Build the offline preset encoder for native acceptance checks
        run: cargo build --locked -p kumi-library --example preset_probe --target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fabfilter-preset-encoder
          path: target/x86_64-pc-windows-msvc/debug/examples/preset_probe.exe
          if-no-files-found: error
          retention-days: 3
