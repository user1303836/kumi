name: Installer

# Builds the bundle the installer downloads, then installs it the way producers do, on macOS, Linux and
# Windows (Windows PowerShell 5.1, the one every Windows has), from a local copy of the release. On a
# version tag it also attaches the bundle, and the installers beside it, to that tag's GitHub release.
#
# Pull requests and pushes to main build with the quicker ci-release profile: those bundles are installed and
# checked, never published. Tags build with the release profile, and so does a nightly run of main, which keeps
# the release profile's cache warm for the next tag (a tag's own cache can't be read by later tags).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    # labeled: the full run starts when a pull request is labelled full-tests (see What to build).
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "47 5 * * *"
  # Warms the release profile's cache by hand, as the nightly run does.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A pull request's newer push replaces its run. Every other run (each push to main, a tag, the nightly)
  # has a group of its own, so a newer one can't cancel it while it waits for a runner.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: What to build
    runs-on: ubuntu-24.04
    outputs:
      full: ${{ steps.plan.outputs.full }}
      checks: ${{ steps.plan.outputs.checks }}
      targets: ${{ steps.plan.outputs.targets }}
      installs: ${{ steps.plan.outputs.installs }}
      migrations: ${{ steps.plan.outputs.migrations }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: plan
        shell: bash
        run: |
          # Main, and pull requests that change installing, updating, releasing, Willington's files, the Mac helper the
          # bundle carries, the tar and PowerShell Kumi runs, how it downloads (its HTTP client and network settings) and
          # builds paths, how Kumi finds, opens and checks the DAW (its DAW modules and the doctor), how Kumi's extension
          # goes into Live, or how REAPER's and Renoise's bridges are built and go in (the extension's build, shim, SDK and
          # entry point, the host's binary, the tool's manifest, entry and version, and the shared lifecycle, detection
          # and files: a REAPER change kind or a host tool is CI's), build and install on one machine of each system (Linux and Windows on x64, macOS on Apple
          # silicon); tags, a run by hand and a pull request labelled full-tests build all six platforms, install each,
          # update to it from the release before it and check the update from the JavaScript release (see below). A pull
          # request that changes the bridge (the Remote Script, the protocol it ships, the Live extension), a version
          # number or how Kumi stores what it keeps (the store, settings and sign-ins, memory, techniques, playbook, gaps,
          # an older Kumi's files) installs on Linux. Any other builds Linux's bundle only; main installs and checks it once
          # merged.
          full=true
          checks=true
          installing_paths='^(install\.(sh|ps1)|scripts/|vendor/willington/|\.github/workflows/installer\.yml|crates/kumi/src/(install|update|process\.rs|cli/|daw/|doctor)|crates/ableton-mcp-server/src/(lifecycle|delivery|migrate|setup|install_remote_script|platform)|crates/kumi-runtime/src/integrations/ableton/hands/(KumiHands\.swift|mac\.rs)|crates/kumi-runtime/src/(system\.rs|ai/http\.rs|net/|library/sources\.rs)|crates/reaper-kumi/(build\.rs|Cargo\.toml|shim/|sdk/|src/lib\.rs)|crates/daw-mcp-server/(Cargo\.toml|src/bin/)|crates/daw-bridge/(Cargo\.toml|src/(lifecycle|install|detect|files|owner|paths)\.rs)|daws/renoise/com\.kumi\.Bridge\.xrnx/(manifest\.xml|main\.lua|payload/version\.lua))'
          # A change to any of these gets every system's install and transition jobs before it merges: main broke once
          # when the Mac helper's didn't. Each has to be there, so a renamed one can't drop out unnoticed.
          for path in install.sh install.ps1 crates/kumi/src/install.rs crates/kumi/src/update.rs crates/kumi/src/install/migration.rs \
            crates/kumi/src/daw/ableton/bridge_setup.rs crates/kumi/src/daw/ableton/live_extension.rs \
            crates/kumi/src/daw/ableton/live_app.rs crates/kumi/src/process.rs crates/kumi/src/doctor.rs \
            crates/kumi/src/doctor/installation.rs crates/kumi-runtime/src/integrations/ableton/hands/KumiHands.swift \
            crates/kumi-runtime/src/integrations/ableton/hands/mac.rs crates/kumi-runtime/src/system.rs crates/kumi-runtime/src/ai/http.rs \
            crates/kumi-runtime/src/library/sources.rs crates/ableton-mcp-server/src/install_remote_script.rs \
            crates/ableton-mcp-server/src/lifecycle.rs crates/ableton-mcp-server/src/delivery_install.rs \
            crates/kumi/src/daw/own.rs crates/daw-bridge/src/lifecycle.rs crates/daw-bridge/src/install.rs crates/daw-bridge/src/detect.rs \
            crates/reaper-kumi/build.rs crates/reaper-kumi/src/lib.rs crates/daw-mcp-server/src/bin/daw-mcp-server.rs \
            crates/daw-bridge/src/files.rs crates/daw-bridge/src/owner.rs crates/daw-bridge/src/paths.rs crates/reaper-kumi/shim/csurf.cpp \
            daws/renoise/com.kumi.Bridge.xrnx/manifest.xml daws/renoise/com.kumi.Bridge.xrnx/main.lua daws/renoise/com.kumi.Bridge.xrnx/payload/version.lua; do
            test -e "$path" || { echo "::error::$path, which the installs depend on, isn't there: point this check at its new name"; exit 1; }
            grep -q -E "$installing_paths" <<<"$path" || { echo "::error::$path must count as installing"; exit 1; }
          done
          # The nightly run only builds, to keep the release profile's cache warm. A run started by hand also installs.
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            checks=false
          fi
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="origin/${GITHUB_BASE_REF}"
            # Read whole, then searched: grep -q can close a pipe early, and git, still writing, fails under pipefail.
            changed="$(git diff --name-only "$base...HEAD")"
            installing="$(grep -E "$installing_paths" <<<"$changed" | grep -v -E '^scripts/test-isolated\.|^crates/(reaper-kumi|daw-bridge|daw-mcp-server)/(tests|examples)/|^crates/(reaper-kumi|daw-bridge|daw-mcp-server)/src/(.*/)?tests\.rs$' || true)"
            # Cargo's changed lines less version numbers (a bridge or release bump): what's left is a dependency.
            dependencies="$(git diff -U0 "$base...HEAD" -- Cargo.toml Cargo.lock 'crates/*/Cargo.toml' \
              | grep -E '^[-+]' | grep -v -E '^(---|\+\+\+) |^[-+]version = "[^"]*"$' || true)"
            if [[ -z "$installing" && -z "$dependencies" ]]; then
              full=false
              if ! grep -q -E '^(remote-script/|protocol/|apps/live-extension/|Cargo\.(toml|lock)$|crates/[^/]+/Cargo\.toml$|crates/kumi-store/|crates/kumi-runtime/src/core/(memory|techniques|playbook|gaps|file_sync|store_[a-z_]+)\.rs$|crates/kumi/src/config\.rs$)' <<<"$changed"; then
                checks=false
              fi
            fi
          fi
          # Every platform, the updates from GitHub's releases, the edges and the transition from the JavaScript installer run
          # on tags, by hand and on a pull request labelled full-tests (the nightly run only builds, above). Each push to
          # main, and a pull request that changes installing, install and remove on one machine of each system: Linux and
          # Windows on x64, macOS on Apple silicon.
          extended=false
          case "${{ github.event_name }}" in
            workflow_dispatch) extended=true ;;
            push) [[ "${{ github.ref }}" == refs/tags/v* ]] && extended=true ;;
            pull_request) [[ "${{ contains(github.event.pull_request.labels.*.name, 'full-tests') }}" == "true" ]] && extended=true ;;
          esac
          if [[ "${{ github.event_name }}" == "schedule" ]]; then extended=true; fi
          echo "full=$extended" >> "$GITHUB_OUTPUT"
          echo "checks=$checks" >> "$GITHUB_OUTPUT"
          if $extended; then
            # The Intel Mac bundle is built on an Apple Silicon Mac, a cross build: the Intel runners take about twice
            # as long. The Intel Mac install below still runs on Intel.
            echo 'targets=[{"os":"macos-15","target":"aarch64-apple-darwin"},{"os":"macos-15","target":"x86_64-apple-darwin"},{"os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu"},{"os":"ubuntu-22.04-arm","target":"aarch64-unknown-linux-gnu"},{"os":"windows-2025","target":"x86_64-pc-windows-msvc"},{"os":"windows-11-arm","target":"aarch64-pc-windows-msvc"}]' >> "$GITHUB_OUTPUT"
            # One install on each system (update) also updates to this bundle from the release before it, from GitHub.
            echo 'installs=[{"os":"macos-15","label":"macOS-arm64","update":true},{"os":"macos-15-intel","label":"macOS-x64"},{"os":"ubuntu-22.04","label":"Linux-x64","update":true},{"os":"ubuntu-22.04-arm","label":"Linux-arm64"},{"os":"windows-2025","label":"Windows-x64","update":true},{"os":"windows-11-arm","label":"Windows-arm64"}]' >> "$GITHUB_OUTPUT"
            echo 'migrations=["macos-15","ubuntu-24.04","windows-2025"]' >> "$GITHUB_OUTPUT"
          elif $full; then
            echo 'targets=[{"os":"macos-15","target":"aarch64-apple-darwin"},{"os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu"},{"os":"windows-2025","target":"x86_64-pc-windows-msvc"}]' >> "$GITHUB_OUTPUT"
            echo 'installs=[{"os":"macos-15","label":"macOS-arm64"},{"os":"ubuntu-22.04","label":"Linux-x64"},{"os":"windows-2025","label":"Windows-x64"}]' >> "$GITHUB_OUTPUT"
            echo 'migrations=[]' >> "$GITHUB_OUTPUT"
          else
            echo 'targets=[{"os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu"}]' >> "$GITHUB_OUTPUT"
            echo 'installs=[{"os":"ubuntu-22.04","label":"Linux-x64"}]' >> "$GITHUB_OUTPUT"
            echo 'migrations=[]' >> "$GITHUB_OUTPUT"
          fi

  native:
    name: Native bundle / ${{ matrix.target }}
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.targets) }}
    env:
      CARGO_INCREMENTAL: 0
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      # What's published (tags) and the nightly cache warm-up build with release; the rest with ci-release.
      PROFILE: ${{ (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'release' || 'ci-release' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          # And REAPER's extension's (scripts/build-native-release.py): both Mac architectures, in one file, and on Windows
          # the x64 build, which REAPER for Windows on Arm (ARM64EC) loads too.
          targets: ${{ matrix.target }}${{ runner.os == 'macOS' && ',aarch64-apple-darwin,x86_64-apple-darwin' || '' }}${{ matrix.target == 'aarch64-pc-windows-msvc' && ',x86_64-pc-windows-msvc' || '' }}
      # Saved from main only: pull requests and tags restore main's (ci-release from its pushes, release from its
      # nightly run).
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          key: ${{ env.PROFILE }}-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Only the Mac bundles carry the helper Kumi uses Live's menus with; each Mac job builds it (universal, under
      # a minute) instead of waiting for a job of its own.
      - name: Build Kumi's Mac helper
        if: runner.os == 'macOS'
        run: python3 scripts/build-hands.py
      - name: Build and bind the release artifacts
        shell: bash
        run: python3 scripts/build-native-release.py --target '${{ matrix.target }}' --profile "$PROFILE" --out release
      - name: Each Mac binary is built for its target's architecture
        if: runner.os == 'macOS'
        shell: bash
        run: |
          want=arm64
          if [[ '${{ matrix.target }}' == x86_64-* ]]; then want=x86_64; fi
          for name in kumi ableton-mcp-server ableton-mcp-analysis-worker daw-mcp-server kumi-harness kumi-library-measure kumi-library-learner; do
            archs="$(lipo -archs "target/${{ matrix.target }}/$PROFILE/$name")"
            echo "$name: $archs"
            test "$archs" = "$want"
          done
          # REAPER's extension, as Apple's own tools see it (the release script read it too): both architectures in one
          # file, its signature whole, and its LINKEDIT laid out as dyld wants.
          extension="target/reaper-extension/${{ matrix.target }}/reaper_kumi.dylib"
          archs="$(lipo -archs "$extension" | tr ' ' '\n' | sort | xargs)"
          echo "reaper_kumi.dylib: $archs"
          test "$archs" = "arm64 x86_64"
          codesign --verify --strict --verbose "$extension"
          test "$(otool -D "$extension" | tail -n 1)" = "@rpath/reaper_kumi.dylib"
          if dyld_info -segments "$extension" | grep -i mis-aligned; then exit 1; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.target }}
          path: release/
          if-no-files-found: error
          retention-days: 7

  bundle:
    name: Aggregate native and existing-installer releases
    needs: [plan, native]
    # With the installs and update checks after it, only where they're wanted (see What to build).
    if: ${{ !cancelled() && needs.native.result == 'success' && needs.plan.outputs.checks == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-*
          path: native-releases
      - name: Keep the manifest consumed by existing Node 24 installs
        # One artifact (a pull request's Linux-only build) is extracted straight into the folder; several
        # get a folder each. Each bundle sits beside its manifest either way.
        run: python3 scripts/build-migration-release.py $(find native-releases -name kumi-release.json | sort) --node "$(node -p process.versions.node)" --out release
      # The one-liners fetch the latest release's installer, so a change to one reaches producers with its release,
      # never before. The jobs below install with these copies, as served from the release.
      - name: The installers, beside the bundles they install
        run: cp install.sh install.ps1 release/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kumi-release
          path: release/
          retention-days: 7

  install:
    name: Install / ${{ matrix.label }}
    needs: [plan, bundle]
    if: ${{ !cancelled() && needs.bundle.result == 'success' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.installs) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 (Node 24)
        with:
          name: kumi-release
          path: release
      # Every file as GitHub serves a release's: application/octet-stream, with no charset (PowerShell's irm
      # decodes such a script by its own default). The server listens without first looking up this host's full name,
      # which takes a macOS runner about 35 s.
      - name: Serve the release locally, as GitHub does
        shell: bash
        run: |
          cd release && (python3 -c 'import http.server as h; h.HTTPServer.server_bind = h.socketserver.TCPServer.server_bind; h.SimpleHTTPRequestHandler.guess_type = lambda self, path: "application/octet-stream"; h.test(h.SimpleHTTPRequestHandler, port=8765, bind="127.0.0.1")' >/dev/null 2>&1 &)
          # The server can take a few seconds to listen on a busy runner (Windows especially): wait for it.
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/kumi-release.json; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Install, use, update and remove (macOS, Linux)
        if: runner.os != 'Windows'
        shell: bash
        env:
          KUMI_HOME: ${{ runner.temp }}/kumi-home
          KUMI_RELEASES: http://127.0.0.1:8765
          SHELL: /bin/bash
        run: |
          set -eux
          # A variable name running straight into a non-ASCII character ("$version…") is read as part of
          # the name by macOS's /bin/sh (bash 3.2) in a UTF-8 locale: brace it ("${version}…").
          if LC_ALL=C grep -nE '\$[A-Za-z_][A-Za-z0-9_]*[^ -~]' install.sh; then exit 1; fi
          # As producers run it: the one-liner, the release's installer piped into sh from a Terminal (a UTF-8 locale),
          # with no Node of its own on PATH.
          curl -fsSL "$KUMI_RELEASES/install.sh" | env -i HOME="$HOME" PATH=/usr/bin:/bin:/usr/sbin:/sbin SHELL=/bin/bash LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8 KUMI_HOME="$KUMI_HOME" KUMI_RELEASES="$KUMI_RELEASES" sh
          # REAPER's and Renoise's folders as each makes them on its first run, scratch ones (no REAPER or Renoise here),
          # named the way a producer names folders kept elsewhere; each holds a file of the producer's own where Kumi
          # puts its bridge.
          reaper="$RUNNER_TEMP/REAPER"; renoise="$RUNNER_TEMP/Renoise/V3.5.4"
          python3 scripts/tests/daw_bridges.py prepare "$reaper" "$renoise"
          kumi() { env -i HOME="$HOME" PATH=/usr/bin:/bin TERM=xterm KUMI_RELEASES="$KUMI_RELEASES" KUMI_REAPER_RESOURCE_DIR="$reaper" KUMI_RENOISE_PREFS_DIR="$renoise" "$KUMI_HOME/bin/kumi" "$@"; }
          kumi --version | grep -q "Kumi $(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          kumi --help | grep -q "kumi bridge"
          kumi doctor || true
          test ! -e "$KUMI_HOME/node"
          "$KUMI_HOME/app/ableton-mcp-server" --version
          printf '%s' '{"mode":"analyze","source":{"pcmBase64":"AAAAPwAAAL8AAAA/AAAAvw==","sampleRate":48000}}' | "$KUMI_HOME/app/ableton-mcp-analysis-worker" > worker.json
          python3 -c 'import json; r=json.load(open("worker.json")); assert r["ok"] and r["result"]["sampleCount"] == 4 and r["result"]["peak"] == 0.5'
          test -x "$KUMI_HOME/app/ableton-mcp-analysis-worker"
          # PATH line added once, in the startup file bash reads, and not again on a second run (which repairs).
          marked() { grep -c "Added by the Kumi installer" "$HOME/.bashrc" "$HOME/.bash_profile" "$HOME/.bash_login" "$HOME/.profile" 2>/dev/null | awk -F: '{ n += $NF } END { print n + 0 }'; }
          test "$(marked)" = 1
          curl -fsSL "$KUMI_RELEASES/install.sh" | env -i HOME="$HOME" PATH=/usr/bin:/bin SHELL=/bin/bash KUMI_HOME="$KUMI_HOME" KUMI_RELEASES="$KUMI_RELEASES" sh
          test "$(marked)" = 1
          ls -la "$KUMI_HOME"
          test -d "$KUMI_HOME/app.previous"
          # The bridge from the bundle, into a scratch Remote Scripts folder (no Live here).
          mkdir -p "$RUNNER_TEMP/User Library/Remote Scripts"
          env -i HOME="$HOME" PATH=/usr/bin:/bin KUMI_REMOTE_SCRIPTS_DIR="$RUNNER_TEMP/User Library/Remote Scripts" KUMI_BRIDGE_WAIT_SECONDS=0 "$KUMI_HOME/bin/kumi" bridge --yes
          test -f "$RUNNER_TEMP/User Library/Remote Scripts/AbletonMcpBridge/ableton_mcp_remote_script.py"
          # REAPER's extension and Renoise's tool from the bundle, through Kumi's lifecycle: each exactly the copy the bundle
          # carries, with its reference, receipt and kept generation; the extension loads, with REAPER's entry point; and
          # Kumi's host for them starts.
          kumi --daw reaper bridge --yes
          kumi --daw renoise bridge --yes
          daws() { python3 scripts/tests/daw_bridges.py placed "$KUMI_HOME/app" "$KUMI_HOME" "$reaper" "$renoise" "$@"; }
          daws --load
          daws > daws.txt
          "$KUMI_HOME/app/daw-mcp-server" --version
          kumi --daw reaper doctor || true
          kumi update | tee update.txt; grep -q "up to date" update.txt
          test "$(daws)" = "$(cat daws.txt)"   # up to date: both bridges as they were, the one to roll back to kept
          # Two rollbacks, each DAW's bridge going with Kumi: the Kumi the repair kept is made to carry other copies of
          # both, as an earlier release would (none before this one carries them), and the second rollback puts back
          # this build's from the generations kept at the first install.
          python3 scripts/tests/daw_bridges.py earlier "$KUMI_HOME/app.previous" 0.0.9
          kumi update --rollback
          kumi --version
          daws | tee earlier.txt
          grep -q -E '^reaper 0\.0\.9 [0-9a-f]+ [^ ]+ rollback$' earlier.txt
          grep -q -E '^renoise 0\.0\.9 [0-9a-f]+ [^ ]+ rollback$' earlier.txt
          kumi update --rollback
          kumi --version
          daws | tee forward.txt
          test "$(cut -d' ' -f1-4 forward.txt)" = "$(cut -d' ' -f1-4 daws.txt)"
          echo 1 > "$KUMI_HOME/settings-marker"
          # A file of the producer's in Kumi's tool: uninstalling takes the tool out and keeps that copy for them.
          echo '-- mine' > "$renoise/Scripts/Tools/com.kumi.Bridge.xrnx/mine.lua"
          kumi uninstall --yes
          # One test a line: bash -e doesn't stop at a failing one that isn't the last in an && list.
          test ! -e "$KUMI_HOME/app"
          test ! -e "$KUMI_HOME/node"
          test ! -e "$KUMI_HOME/bin"
          test ! -e "$KUMI_HOME/bridges/reaper"
          test ! -e "$KUMI_HOME/bridges/renoise/generations"
          test -n "$(ls "$KUMI_HOME/bridges/renoise/changed")"   # the producer's copy stays
          test -f "$KUMI_HOME/settings-marker"   # the producer's own files stay
          test "$(marked)" = 0
          python3 scripts/tests/daw_bridges.py removed "$KUMI_HOME" "$reaper" "$renoise"

      - name: GitHub's latest and the release before this one, updated to this one and back twice (zsh on macOS, fish on Linux; a non-ASCII home)
        if: ${{ !cancelled() && matrix.update && runner.os != 'Windows' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          KUMI_RELEASES: http://127.0.0.1:8765
        run: |
          set -eux
          version="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          # The release producers update from: the newest one published below this build's version. Three tries: a tag's
          # publish waits on this step.
          releases() {
            for _ in 1 2 3; do gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 100 --json tagName --jq '.[].tagName' && return; sleep 10; done
            return 1
          }
          previous="$(releases | python3 -c '
          import re, sys
          key = lambda version: tuple(map(int, version.split(".")))
          published = [m[1] for line in sys.stdin if (m := re.fullmatch(r"v(\d+\.\d+\.\d+)", line.strip()))]
          print(max((v for v in published if key(v) < key(sys.argv[1])), key=key))' "$version")"
          # A home with spaces and non-ASCII letters. zsh (the Mac's) reads its startup files from ZDOTDIR here, fish
          # from conf.d. (zsh 5.9 reads none from a ZDOTDIR named in some non-ASCII letters, such as ホーム: zsh's own.)
          home="$RUNNER_TEMP/John Smith ホーム é"
          scripts="$home/Music/Ableton/User Library/Remote Scripts"
          mkdir -p "$scripts"
          if [[ "$RUNNER_OS" == macOS ]]; then
            shell=/bin/zsh
            zdotdir="$RUNNER_TEMP/zsh startup"
            rc="$zdotdir/.zshrc"
          else
            apt_get() { sudo apt-get -qq -o Acquire::Retries=3 "$@" >/dev/null; }
            apt_get install -y fish || { apt_get update && apt_get install -y fish; }
            shell="$(command -v fish)"
            zdotdir=
            rc="$home/.config/fish/conf.d/kumi.fish"
          fi
          # As a producer runs things: their home and shell and a UTF-8 locale, nothing else of this runner's.
          producer() { env -i HOME="$home" PATH=/usr/bin:/bin:/usr/sbin:/sbin SHELL="$shell" ${zdotdir:+"ZDOTDIR=$zdotdir"} LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8 "$@"; }
          reaper="$home/REAPER"; renoise="$home/Renoise/V3.5.4"
          kumi() {
            producer KUMI_RELEASES="$KUMI_RELEASES" KUMI_REMOTE_SCRIPTS_DIR="$scripts" KUMI_LIVE_EXTENSIONS_DIR="$home/Live Extensions" \
              KUMI_BRIDGE_WAIT_SECONDS=0 KUMI_REAPER_RESOURCE_DIR="$reaper" KUMI_RENOISE_PREFS_DIR="$renoise" "$home/.kumi/bin/kumi" "$@"
          }
          marked() { if [[ -f "$rc" ]]; then grep -c "Added by the Kumi installer" "$rc" || true; else echo 0; fi; }

          # This build's installer, as the release serves it, installing GitHub's latest: the one-liner, with no
          # KUMI_RELEASES.
          curl -fsSL "$KUMI_RELEASES/install.sh" | producer sh
          kumi --version
          test "$(marked)" = 1
          # A new terminal window finds kumi through the line the installer added.
          if [[ "$RUNNER_OS" == macOS ]]; then found="$(producer zsh -i -c 'command -v kumi' </dev/null)"; else found="$(producer fish -c 'command --search kumi')"; fi
          test "$found" = "$home/.kumi/bin/kumi"
          # Pinned to the release before this one: an older one over the latest (or a repair, when that's the latest).
          curl -fsSL "$KUMI_RELEASES/install.sh" | producer KUMI_VERSION="$previous" sh
          test "$(kumi --version)" = "Kumi $previous"
          test "$(marked)" = 1

          # That release's bridge and Kumi's extension in Live (scratch folders: no Live here), then its update to this
          # build, and back and forth. The first rollback puts back the very bridge that went with that release (the
          # package it runs: each install gets a folder of its own) and its extension; the second, this build's. When
          # the update left the bridge as it was, neither rollback touches it.
          kumi bridge --yes
          bridge() {
            python3 -c '
          import json, os, sys
          read = lambda path: json.load(open(path, encoding="utf-8"))
          command = read(read(os.path.join(sys.argv[1], "AbletonMcpBridge", "bridge-reference.json"))["config"])["server"]["command"]
          package = read(os.path.join(os.path.dirname(command), "package.json"))
          print(package.get("bridge") or package["version"], command)' "$scripts"
          }
          extension() {
            python3 -c '
          import hashlib, json, os, sys
          print(json.load(open(os.path.join(sys.argv[1], "manifest.json"), encoding="utf-8"))["version"],
                hashlib.sha256(open(os.path.join(sys.argv[1], "dist", "extension.js"), "rb").read()).hexdigest())' "$home/Live Extensions/kumi.kumi"
          }
          before="$(bridge)"; before_extension="$(extension)"
          kumi update
          test "$(kumi --version)" = "Kumi $version"
          after="$(bridge)"; after_extension="$(extension)"
          # REAPER's extension and Renoise's tool from this build, in scratch DAW folders. A release that knows neither DAW
          # (1.19 and before) leaves both as they are on its rollback, said; one that carries them puts back its own copy of
          # each, said where it isn't this build's. The rollback back to this build puts this build's back, from the
          # generations kept.
          python3 scripts/tests/daw_bridges.py prepare "$reaper" "$renoise"
          kumi --daw reaper bridge --yes
          kumi --daw renoise bridge --yes
          placed() { python3 scripts/tests/daw_bridges.py placed "$home/.kumi/$1" "$home/.kumi" "$reaper" "$renoise"; }
          placed app > daws.txt
          kumi update --rollback | tee rollback.txt
          test "$(kumi --version)" = "Kumi $previous"
          test "$(bridge)" = "$before"
          test "$(extension)" = "$before_extension"
          if [[ -d "$home/.kumi/app/daws" ]]; then
            placed app | tee earlier.txt
            while read -r daw carried sha _; do
              if [[ "$sha" != "$(grep "^$daw " daws.txt | cut -d' ' -f3)" ]]; then
                if [[ "$daw" == reaper ]]; then said="Kumi's extension $carried is back in REAPER"; else said="Kumi's tool $carried is back in Renoise"; fi
                grep -qF "$said, as Kumi $previous had it" rollback.txt
              fi
            done < earlier.txt
          else
            grep -q "Kumi's extension stays in REAPER" rollback.txt
            grep -q "Kumi's tool stays in Renoise" rollback.txt
            test "$(placed app.previous)" = "$(cat daws.txt)"
          fi
          kumi update --rollback
          test "$(kumi --version)" = "Kumi $version"
          if [[ "$before" == "$after" ]]; then test "$(bridge)" = "$after"; else test "$(bridge | cut -d' ' -f1)" = "${after%% *}"; fi
          test "$(extension)" = "$after_extension"
          test "$(placed app | cut -d' ' -f1-4)" = "$(cut -d' ' -f1-4 daws.txt)"

          # Uninstalling takes the PATH line out, and REAPER's and Renoise's bridges.
          kumi uninstall --yes
          test ! -e "$home/.kumi/app"
          test ! -e "$home/.kumi/bin"
          test "$(marked)" = 0
          python3 scripts/tests/daw_bridges.py removed "$home/.kumi" "$reaper" "$renoise"

      - name: A Kumi stays in place when Windows holds its folder (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/tests/install_swap.ps1

      - name: Install, use, update and remove (Windows PowerShell 5.1; KUMI_HOME in a non-ASCII folder)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          # In a folder named with spaces, Japanese and an accented letter: tar.exe reads its arguments in the system's
          # code page. Set here, so the Windows PowerShell 5.1 script itself holds no such letters.
          KUMI_HOME: ${{ runner.temp }}\Jane Doe ホーム é\kumi-home
          KUMI_RELEASES: http://127.0.0.1:8765
        run: |
          $ErrorActionPreference = 'Stop'
          # As producers run it: the one-liner, the release's installer into iex.
          irm "$env:KUMI_RELEASES/install.ps1" | iex
          $kumi = Join-Path $env:KUMI_HOME 'bin\kumi.cmd'
          if (-not (Test-Path $kumi)) { throw 'no launcher' }
          $version = & $kumi --version; Write-Host $version
          if ($version -notmatch 'Kumi \d+\.\d+\.\d+') { throw "unexpected version: $version" }
          if (-not (([Environment]::GetEnvironmentVariable('Path', 'User')) -split ';' | Where-Object { $_ -eq (Join-Path $env:KUMI_HOME 'bin') })) { throw 'PATH not updated' }
          # Kept as a REG_EXPAND_SZ, so %VAR% entries in it still expand.
          if ((Get-Item -LiteralPath 'HKCU:\Environment').GetValueKind('Path') -ne 'ExpandString') { throw 'PATH is no longer REG_EXPAND_SZ' }
          & $kumi --help | Select-String 'kumi bridge' | Out-Null
          & $kumi doctor; $global:LASTEXITCODE = 0
          if (Test-Path (Join-Path $env:KUMI_HOME 'node')) { throw 'fresh native install brought Node' }
          & (Join-Path $env:KUMI_HOME 'app\ableton-mcp-server.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'native bridge did not start' }
          if (-not (Test-Path (Join-Path $env:KUMI_HOME 'app\ableton-mcp-analysis-worker.exe'))) { throw 'no native analysis worker' }
          # Write the worker's UTF-8 JSON wire bytes directly; PowerShell's text pipeline can recode stdin.
          $workerInput = [Text.Encoding]::UTF8.GetBytes('{"mode":"analyze","source":{"pcmBase64":"AAAAPwAAAL8AAAA/AAAAvw==","sampleRate":48000}}')
          Write-Host ('Worker stdin first 16 bytes: ' + [BitConverter]::ToString($workerInput[0..15]))
          $workerProcess = New-Object Diagnostics.Process
          $workerProcess.StartInfo.FileName = Join-Path $env:KUMI_HOME 'app\ableton-mcp-analysis-worker.exe'
          $workerProcess.StartInfo.UseShellExecute = $false
          $workerProcess.StartInfo.RedirectStandardInput = $true
          $workerProcess.StartInfo.RedirectStandardOutput = $true
          $workerProcess.StartInfo.RedirectStandardError = $true
          $savedInputEncoding = [Console]::InputEncoding
          try {
            # .NET Framework creates and flushes its stdin writer during Start(), before BaseStream.Write.
            # Its encoding comes from Console.InputEncoding; suppress that writer's automatic BOM too.
            [Console]::InputEncoding = New-Object Text.UTF8Encoding($false)
            if ([Console]::InputEncoding.GetPreamble().Length -ne 0) { throw 'console stdin encoding must not emit a preamble' }
            [void]$workerProcess.Start()
            $preambleBytes = $workerProcess.StandardInput.Encoding.GetPreamble().Length
            Write-Host "Worker stdin writer preamble bytes: $preambleBytes"
            if ($preambleBytes -ne 0) { throw 'worker stdin writer must not prepend an encoding preamble' }
            $workerProcess.StandardInput.BaseStream.Write($workerInput, 0, $workerInput.Length)
            $workerProcess.StandardInput.BaseStream.Close()
            $worker = $workerProcess.StandardOutput.ReadToEnd()
            $workerError = $workerProcess.StandardError.ReadToEnd()
            $workerProcess.WaitForExit()
            $workerExit = $workerProcess.ExitCode
          } finally {
            [Console]::InputEncoding = $savedInputEncoding
            $workerProcess.Dispose()
          }
          if ($workerExit -ne 0) { throw "native worker failed ($workerExit): $worker $workerError" }
          $analysis = $worker | ConvertFrom-Json
          if (-not $analysis.ok -or $analysis.result.sampleCount -ne 4 -or $analysis.result.peak -ne 0.5) { throw 'native worker returned unexpected analysis' }
          # Again: a repair, keeping the one before.
          irm "$env:KUMI_RELEASES/install.ps1" | iex
          if (-not (Test-Path (Join-Path $env:KUMI_HOME 'app.previous'))) { throw 'no previous app after a second install' }
          $scripts = Join-Path $env:RUNNER_TEMP 'User Library\Remote Scripts'
          New-Item -ItemType Directory -Force -Path $scripts | Out-Null
          $env:KUMI_REMOTE_SCRIPTS_DIR = $scripts; $env:KUMI_BRIDGE_WAIT_SECONDS = '0'
          & $kumi bridge --yes
          if ($LASTEXITCODE -ne 0) { throw 'kumi bridge failed' }
          if (-not (Test-Path (Join-Path $scripts 'AbletonMcpBridge\ableton_mcp_remote_script.py'))) { throw 'no Remote Script' }
          # REAPER's extension and Renoise's tool from the bundle, into scratch DAW folders (no REAPER or Renoise here), each
          # beside a file of the producer's own that Kumi leaves as it is (scripts/tests/daw_bridges.py checks what's where);
          # the extension loads, with REAPER's entry point; and Kumi's host for them starts.
          $reaper = Join-Path $env:RUNNER_TEMP 'REAPER'; $renoise = Join-Path $env:RUNNER_TEMP 'Renoise\V3.5.4'
          python scripts/tests/daw_bridges.py prepare $reaper $renoise
          if ($LASTEXITCODE -ne 0) { throw "the DAWs' folders weren't made" }
          $env:KUMI_REAPER_RESOURCE_DIR = $reaper; $env:KUMI_RENOISE_PREFS_DIR = $renoise
          & $kumi --daw reaper bridge --yes
          if ($LASTEXITCODE -ne 0) { throw 'kumi --daw reaper bridge failed' }
          & $kumi --daw renoise bridge --yes
          if ($LASTEXITCODE -ne 0) { throw 'kumi --daw renoise bridge failed' }
          function Daws {
            $said = python scripts/tests/daw_bridges.py placed (Join-Path $env:KUMI_HOME 'app') $env:KUMI_HOME $reaper $renoise @args | Out-String
            if ($LASTEXITCODE -ne 0) { throw "REAPER's and Renoise's bridges aren't as Kumi put them" }
            $said
          }
          Write-Host (Daws --load)
          $daws = Daws
          & (Join-Path $env:KUMI_HOME 'app\daw-mcp-server.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'daw-mcp-server did not start' }
          $update = & $kumi update | Out-String; Write-Host $update
          if ($update -notmatch 'up to date') { throw 'update did not say up to date' }
          if ((Daws) -ne $daws) { throw "the update changed REAPER's or Renoise's bridge: $(Daws)" }
          # Two rollbacks, each DAW's bridge going with Kumi: the Kumi the repair kept is made to carry other copies of
          # both, as an earlier release would (none before this one carries them), and the second rollback puts back
          # this build's from the generations kept at the first install.
          python scripts/tests/daw_bridges.py earlier (Join-Path $env:KUMI_HOME 'app.previous') 0.0.9
          if ($LASTEXITCODE -ne 0) { throw "the earlier Kumi's copies weren't made" }
          function Fields([string]$Said) { (($Said -split "`r?`n") | Where-Object { $_ } | ForEach-Object { ($_ -split ' ')[0..3] -join ' ' }) -join '|' }
          & $kumi update --rollback
          if ($LASTEXITCODE -ne 0) { throw 'native rollback failed' }
          if ((& $kumi --version) -ne $version) { throw "the rollback didn't preserve the release" }
          $earlier = Daws; Write-Host $earlier
          if ($earlier -notmatch '(?m)^reaper 0\.0\.9 [0-9a-f]+ \S+ rollback\r?$' -or $earlier -notmatch '(?m)^renoise 0\.0\.9 [0-9a-f]+ \S+ rollback\r?$') { throw "the rollback didn't take both bridges to the earlier Kumi's: $earlier" }
          & $kumi update --rollback
          if ($LASTEXITCODE -ne 0) { throw 'the second native rollback failed' }
          $forward = Daws; Write-Host $forward
          if ((Fields $forward) -ne (Fields $daws)) { throw "the second rollback didn't put back the first copies: $forward" }
          Set-Content -Path (Join-Path $env:KUMI_HOME 'settings-marker') -Value 1
          # A file of the producer's in Kumi's tool: uninstalling takes the tool out and keeps that copy for them.
          Set-Content -Path (Join-Path $renoise 'Scripts\Tools\com.kumi.Bridge.xrnx\mine.lua') -Value '-- mine'
          & $kumi uninstall --yes
          # REAPER's and Renoise's bridges come out at once; Kumi's folders a few seconds later, from a cmd it leaves running.
          python scripts/tests/daw_bridges.py removed $env:KUMI_HOME $reaper $renoise
          if ($LASTEXITCODE -ne 0) { throw "REAPER's or Renoise's bridge stayed" }
          $gones = 'app', 'node', 'bin', 'bridges\reaper', 'bridges\renoise\generations'
          $deadline = (Get-Date).AddSeconds(60)
          while ((Get-Date) -lt $deadline -and @($gones | Where-Object { Test-Path (Join-Path $env:KUMI_HOME $_) })) { Start-Sleep -Milliseconds 500 }
          foreach ($gone in $gones) { if (Test-Path (Join-Path $env:KUMI_HOME $gone)) { throw "$gone still there" } }
          if (-not (Get-ChildItem (Join-Path $env:KUMI_HOME 'bridges\renoise\changed'))) { throw "the producer's copy of the tool wasn't kept" }
          if (-not (Test-Path (Join-Path $env:KUMI_HOME 'settings-marker'))) { throw 'the producer''s files went too' }
          if ((([Environment]::GetEnvironmentVariable('Path', 'User')) -split ';') -contains (Join-Path $env:KUMI_HOME 'bin')) { throw 'PATH still has Kumi' }

      - name: GitHub's latest and the release before this one, updated to this one and back twice (PowerShell 7; KUMI_HOME in a non-ASCII folder)
        if: ${{ !cancelled() && matrix.update && runner.os == 'Windows' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $releases = 'http://127.0.0.1:8765'
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          # The release producers update from: the newest one published below this build's version. Three tries: a tag's
          # publish waits on this step.
          foreach ($try in 1..3) {
            $tags = gh release list --repo $env:GITHUB_REPOSITORY --exclude-drafts --limit 100 --json tagName --jq '.[].tagName'
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 10
          }
          if ($LASTEXITCODE -ne 0) { throw "gh couldn't list the releases" }
          $previous = $tags |
            ForEach-Object { if ($_ -match '^v(\d+\.\d+\.\d+)$') { [version]$Matches[1] } } |
            Where-Object { $_ -lt [version]$version } | Sort-Object -Descending | Select-Object -First 1
          if (-not $previous) { throw 'no published release before this one' }
          $previous = "$previous"
          function Kumi { & $kumi @args; if ($LASTEXITCODE -ne 0) { throw "kumi $args exited $LASTEXITCODE" } }
          function OnPath { ([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') -contains $bin }
          # The bridge in Live: its version, and the package it runs (each install gets a folder of its own).
          function Bridge {
            $read = { param($path) Get-Content -Raw -LiteralPath $path | ConvertFrom-Json }
            $command = (& $read (& $read (Join-Path $scripts 'AbletonMcpBridge\bridge-reference.json')).config).server.command
            $package = & $read (Join-Path (Split-Path $command) 'package.json')
            "$(if ($package.bridge) { $package.bridge } else { $package.version }) $command"
          }
          # Kumi's extension in Live: its version, and its code's checksum.
          function Extension {
            $folder = Join-Path $root 'Live Extensions\kumi.kumi'
            "$((Get-Content -Raw -LiteralPath (Join-Path $folder 'manifest.json') | ConvertFrom-Json).version) $((Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $folder 'dist\extension.js')).Hash)"
          }
          # A home for Kumi in RUNNER_TEMP, with its own Remote Scripts and Extensions folders (no Live here), and REAPER's
          # and Renoise's (no REAPER or Renoise here).
          function UseHome([string]$Folder) {
            $script:root = Join-Path $env:RUNNER_TEMP $Folder
            $env:KUMI_HOME = Join-Path $script:root '.kumi'
            $script:bin = Join-Path $env:KUMI_HOME 'bin'
            $script:kumi = Join-Path $script:bin 'kumi.cmd'
            $script:scripts = Join-Path $script:root 'User Library\Remote Scripts'
            New-Item -ItemType Directory -Force -Path $script:scripts | Out-Null
            $env:KUMI_REMOTE_SCRIPTS_DIR = $script:scripts
            $env:KUMI_LIVE_EXTENSIONS_DIR = Join-Path $script:root 'Live Extensions'
            $env:KUMI_BRIDGE_WAIT_SECONDS = '0'
            $env:KUMI_REAPER_RESOURCE_DIR = $script:reaper = Join-Path $script:root 'REAPER'
            $env:KUMI_RENOISE_PREFS_DIR = $script:renoise = Join-Path $script:root 'Renoise\V3.5.4'
            Remove-Item Env:KUMI_RELEASES, Env:KUMI_VERSION -ErrorAction SilentlyContinue
          }
          # Placed's lines as fields: DAW, version, SHA-256, generation and the receipt's last action.
          function Rows([string]$Said) { @($Said -split "`r?`n" | Where-Object { $_ } | ForEach-Object { , $_.Split(' ') }) }
          # Placed's lines less the last action: the copy, and the generation it came from.
          function Kept([string]$Said) { (Rows $Said | ForEach-Object { $_[0..3] -join ' ' }) -join "`n" }
          # REAPER's extension and Renoise's tool as Kumi put them, compared with the copies the Kumi in `App` carries.
          function Placed([string]$App) {
            $said = python scripts/tests/daw_bridges.py placed (Join-Path $env:KUMI_HOME $App) $env:KUMI_HOME $reaper $renoise | Out-String
            if ($LASTEXITCODE -ne 0) { throw "REAPER's and Renoise's bridges aren't as Kumi put them" }
            $said
          }
          # Uninstalling takes Kumi out of PATH; its folders go a few seconds later, from a cmd it leaves running.
          function Uninstall {
            Kumi uninstall --yes
            $deadline = (Get-Date).AddSeconds(60)
            while ((Get-Date) -lt $deadline -and @('app', 'app.previous', 'bin' | Where-Object { Test-Path -LiteralPath (Join-Path $env:KUMI_HOME $_) })) { Start-Sleep -Milliseconds 500 }
            foreach ($gone in 'app', 'app.previous', 'bin') { if (Test-Path -LiteralPath (Join-Path $env:KUMI_HOME $gone)) { throw "$gone still there" } }
            if (OnPath) { throw 'PATH still has Kumi' }
          }

          # KUMI_HOME in a folder named with spaces, Japanese and an accented letter, as a profile folder can be (tar.exe
          # reads its arguments in the system's code page). This build's installer, as the release serves it, installs
          # GitHub's latest (the one-liner), then this build over it; then the bridge, two rollbacks and the uninstall.
          UseHome ('John Smith ' + [char]0x30DB + [char]0x30FC + [char]0x30E0 + ' ' + [char]0x00E9)
          irm "$releases/install.ps1" | iex
          $latest = & $kumi --version; Write-Host $latest
          if ($latest -notmatch '^Kumi \d+\.\d+\.\d+$') { throw "unexpected version: $latest" }
          if (-not (OnPath)) { throw 'PATH not updated' }
          $env:KUMI_RELEASES = $releases
          irm "$releases/install.ps1" | iex
          if ((& $kumi --version) -ne "Kumi $version") { throw "this build's install didn't give $version" }
          Kumi bridge --yes
          Kumi update --rollback
          if ((& $kumi --version) -ne $latest) { throw "the first rollback didn't give $latest back" }
          Kumi update --rollback
          if ((& $kumi --version) -ne "Kumi $version") { throw "the second rollback didn't give $version" }
          Uninstall

          # The release before this one, pinned, then its own kumi update to this build and back and forth. The first
          # rollback puts back the very bridge that went with that release and its extension; the second, this build's.
          # When the update left the bridge as it was, neither rollback touches it. (In a home with spaces only: that
          # release's updater unpacks with tar.exe.)
          UseHome 'John Smith'
          $env:KUMI_VERSION = $previous
          irm "$releases/install.ps1" | iex
          Remove-Item Env:KUMI_VERSION
          if ((& $kumi --version) -ne "Kumi $previous") { throw "the pinned install didn't give $previous" }
          Kumi bridge --yes
          $before = Bridge; $beforeExtension = Extension
          $env:KUMI_RELEASES = $releases
          Kumi update
          if ((& $kumi --version) -ne "Kumi $version") { throw "the update didn't give $version" }
          $after = Bridge; $afterExtension = Extension
          # REAPER's extension and Renoise's tool from this build, in scratch DAW folders. A release that knows neither DAW
          # (1.19 and before) leaves both as they are on its rollback, said; one that carries them puts back its own copy of
          # each, said where it isn't this build's. The rollback back to this build puts this build's back, from the
          # generations kept.
          python scripts/tests/daw_bridges.py prepare $reaper $renoise
          if ($LASTEXITCODE -ne 0) { throw "the DAWs' folders weren't made" }
          Kumi --daw reaper bridge --yes
          Kumi --daw renoise bridge --yes
          $daws = Placed 'app'
          $rolled = & $kumi update --rollback | Out-String; Write-Host $rolled
          if ($LASTEXITCODE -ne 0) { throw "the first rollback failed" }
          if ((& $kumi --version) -ne "Kumi $previous") { throw "the first rollback didn't give $previous" }
          if ((Bridge) -ne $before) { throw "the first rollback left bridge $(Bridge), not $before" }
          if ((Extension) -ne $beforeExtension) { throw "the first rollback left extension $(Extension), not $beforeExtension" }
          if (Test-Path -LiteralPath (Join-Path $env:KUMI_HOME 'app\daws')) {
            $mine = @{}
            foreach ($row in (Rows $daws)) { $mine[$row[0]] = $row[2] }
            foreach ($row in (Rows (Placed 'app'))) {
              if ($row[2] -ne $mine[$row[0]]) {
                $said = if ($row[0] -eq 'reaper') { "Kumi's extension $($row[1]) is back in REAPER" } else { "Kumi's tool $($row[1]) is back in Renoise" }
                if (-not $rolled.Contains("$said, as Kumi $previous had it")) { throw "the rollback didn't say: $said, as Kumi $previous had it" }
              }
            }
          } else {
            if ($rolled -notmatch "Kumi's extension stays in REAPER" -or $rolled -notmatch "Kumi's tool stays in Renoise") { throw "the rollback didn't say REAPER's and Renoise's bridges stay" }
            if ((Placed 'app.previous') -ne $daws) { throw "the first rollback changed REAPER's or Renoise's bridge" }
          }
          Kumi update --rollback
          if ((& $kumi --version) -ne "Kumi $version") { throw "the second rollback didn't give $version" }
          $bridge = Bridge
          if ($(if ($before -eq $after) { $bridge -ne $after } else { $bridge.Split(' ')[0] -ne $after.Split(' ')[0] })) { throw "the second rollback left bridge $bridge, not $after" }
          if ((Extension) -ne $afterExtension) { throw "the second rollback left extension $(Extension), not $afterExtension" }
          if ((Kept (Placed 'app')) -ne (Kept $daws)) { throw "the second rollback didn't put this build's REAPER and Renoise bridges back" }
          Uninstall
          python scripts/tests/daw_bridges.py removed $env:KUMI_HOME $reaper $renoise
          if ($LASTEXITCODE -ne 0) { throw "REAPER's or Renoise's bridge stayed" }

  edges:
    # install.sh and install.ps1 when a release isn't there, nothing answers, a Wi-Fi sign-in page answers, a checksum
    # doesn't match, the new Kumi doesn't start or Ctrl-C comes; repairs; and the kumi command without Kumi's app.
    # Releases with a stand-in Kumi come from a local server, so this needs no bundle.
    name: Installer edges / ${{ matrix.os }}
    needs: plan
    if: ${{ needs.plan.outputs.full == 'true' && needs.plan.outputs.checks == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: install.sh at the edges (macOS, Linux)
        if: runner.os != 'Windows'
        run: python3 -m unittest discover -v -s scripts/tests -p test_install_script.py
      - name: A version GitHub hasn't got, asked of GitHub (macOS's curl exits 56 on its 404)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -u
          home="$RUNNER_TEMP/missing-version-home"; mkdir -p "$home"
          if env -i HOME="$home" PATH=/usr/bin:/bin:/usr/sbin:/sbin KUMI_VERSION=9.9.9 KUMI_NO_MODIFY_PATH=1 sh install.sh > said.txt 2>&1; then
            cat said.txt; exit 1
          fi
          cat said.txt
          grep -qF "there's no Kumi 9.9.9. The releases are at https://github.com/user1303836/kumi/releases" said.txt
          test ! -e "$home/.kumi"
      - name: install.ps1 at the edges (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/tests/install_errors.ps1
      - name: The install.ps1 to compare with, 1.16.1's (its glyphs as text, before the file went ASCII)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git fetch --depth=1 origin refs/tags/v1.16.1:refs/tags/v1.16.1
          git cat-file blob v1.16.1:install.ps1 > install-1.16.1.ps1
      - name: install.ps1 prints what 1.16.1's did, byte for byte (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/tests/install_output.ps1 -Reference install-1.16.1.ps1
      - name: install.ps1 prints what 1.16.1's did, byte for byte (PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/tests/install_output.ps1 -Reference install-1.16.1.ps1

  migration:
    name: Existing installer transition / ${{ matrix.os }}
    needs: [plan, bundle]
    if: ${{ !cancelled() && needs.bundle.result == 'success' && needs.plan.outputs.migrations != '[]' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.migrations) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kumi-release
          path: release
      - name: Fetch the last JavaScript release (Kumi 1.7.5), whose updater existing installations run
        shell: bash
        run: echo "KUMI_LEGACY_APP=$(python3 scripts/fetch-legacy-release.py "$RUNNER_TEMP/kumi-1.7.5")" >> "$GITHUB_ENV"
      - name: Verify old updater, native probes, data preservation and rollback
        env:
          KUMI_NATIVE_RELEASES: ${{ github.workspace }}/release
        run: python3 -m unittest discover -s scripts/tests -p test_migration_release.py

  publish:
    name: Attach the bundle to the release
    # A tag's push only: a run started by hand on a tag must not upload new binaries over a published release.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    # The installers go out with the release as the one-liners' copy, so their error-path checks (edges) pass first.
    needs: [bundle, install, migration, edges]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 (Node 24)
        with:
          name: kumi-release
          path: release
      # A published release keeps its assets: a re-run builds new, non-identical binaries, which mustn't replace the
      # ones producers have checked against SHA256SUMS.
      - name: Upload to the release (a draft one is made if there's none yet)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)"; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "Kumi ${TAG#v}" --notes "Release notes to come."
            draft=true
          fi
          if [[ "$draft" != true ]]; then
            echo "$TAG is already published, so its assets stay as they are."
            exit 0
          fi
          gh release upload "$TAG" release/*.tar.gz release/*.json release/SHA256SUMS release/install.sh release/install.ps1 --repo "$GITHUB_REPOSITORY" --clobber
      # scripts/release.py writes the notes into the draft, marked as its own, when it pushes the tag. Such a draft is
      # published now, every install and migration having passed. Any other draft (notes to come, or written by hand)
      # stays a draft for whoever finishes it.
      - name: Publish the release when scripts/release.py wrote its notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" == true ]]; then
            body="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
            if [[ "$body" != *"<!-- kumi:release-notes -->"* ]]; then
              echo "$TAG's notes aren't scripts/release.py's, so it stays a draft."
              exit 0
            fi
            # Published, it's the latest, which the one-liners fetch their installer from: both have to be there.
            assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
            for installer in install.sh install.ps1; do
              if ! grep -qx "$installer" <<<"$assets"; then
                echo "$TAG has no $installer, so it stays a draft." >&2
                exit 1
              fi
            done
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
            echo "Published $TAG."
          fi
          # Latest is the highest version published, so an older tag's build that finishes later doesn't take it back.
          # Set on every run, so a re-run finishes what a failed one left.
          tags="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 100 --json tagName --jq '.[].tagName')"
          latest="$(grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' <<<"$tags" | sort -V | tail -n 1)"
          gh release edit "$latest" --repo "$GITHUB_REPOSITORY" --latest
          echo "The latest release is $latest."

  nightly-failed:
    # The nightly run is the only one before a tag that builds all six bundles with the release profile, REAPER's
    # extension in each (the cross builds, lipo, strip and codesign). A break there stops the next release, Live's
    # fixes too, so it opens an issue (or comments on the open one) to be seen the next morning.
    name: The nightly build failed
    needs: [plan, native]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="The nightly Installer build failed"
          body="The nightly release-profile build of main failed: $RUN. Every release builds the same six bundles, with REAPER's extension in each, so a tag fails the same way until this is fixed."
          open="$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")"
          if [ -n "$open" ]; then
            gh issue comment "$open" -R "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
