name: Willington files

# Willington's runtime files in vendor/willington/ ship to every producer, and their native libraries can't be
# reviewed, so who sends them is the check. Only the repository owner's pull requests, from a branch in this
# repository, change the folder, and such a pull request changes nothing else. An update comes from a Bundle run
# on Willington's main, by scripts/vendor-willington.py (see docs/en/DEVELOPER_GUIDE.md).
on:
  # The base branch's copy of this workflow runs, never the pull request's, so a pull request can't change
  # the check it's held to. It reads the pull request's metadata only, never its code. `edited` covers a
  # pull request moved onto main from another branch.
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    name: Willington files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Only the owner's pull requests change vendor/willington, and change nothing else
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # One row per changed file: its path, and its old one when it moved (moving a file in or out counts).
          rows="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[] | [.filename, .previous_filename // ""] | @tsv')"
          # The API lists at most 3,000 files: a pull request it can't list whole can't pass.
          if (( $(grep -c '' <<<"$rows") >= 3000 )); then
            echo "::error::This pull request changes too many files to check against vendor/willington/."
            exit 1
          fi
          paths="$(tr '\t' '\n' <<<"$rows" | grep -v '^$' || true)"
          vendor="$(grep -E '^vendor/willington(/|$)' <<<"$paths" || true)"
          other="$(grep -v -E '^vendor/willington(/|$)' <<<"$paths" || true)"
          if [[ -z "$vendor" ]]; then
            echo "Nothing in vendor/willington/ changes."
            exit 0
          fi
          # A fork's branch is pushed by whoever owns the fork; a branch here only by this repository's writers.
          if [[ "$AUTHOR" != "$OWNER" || "$AUTHOR_TYPE" != "User" || "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]]; then
            echo "Only $OWNER's pull requests, from a branch in $GITHUB_REPOSITORY, change vendor/willington/."
            echo "This pull request is from $AUTHOR, on ${HEAD_REPO:-a deleted repository}, and changes:"
            sed 's/^/  /' <<<"$vendor"
            echo "::error::Only $OWNER's pull requests change vendor/willington/."
            exit 1
          fi
          if [[ -n "$other" ]]; then
            echo "A Willington update changes vendor/willington/ only. This pull request also changes:"
            sed 's/^/  /' <<<"$other"
            echo "::error::A pull request that changes vendor/willington/ changes nothing else."
            exit 1
          fi
          echo "A Willington update from $OWNER, changing vendor/willington/ only."
