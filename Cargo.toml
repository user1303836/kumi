[workspace]
resolver = "2"
members = [
    "crates/kumi-common",
    "crates/kumi-store",
    "crates/kumi-genexpr",
    "crates/kumi-runtime",
    "daws/ableton/ableton-mcp-server",
    "crates/kumi",
    "daws/own/daw-bridge",
    "daws/own/daw-mcp-server",
    "daws/reaper/reaper-kumi",
    "crates/kumi-testkit",
    "crates/kumi-types",
    "crates/kumi-net",
    "crates/kumi-media",
    "crates/kumi-ai",
    "crates/kumi-web",
    "crates/kumi-library",
    "crates/kumi-listening",
    "daws/ableton/kumi-daw-ableton",
]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/user1303836/kumi"
rust-version = "1.89"

[workspace.dependencies]
kumi-common = { path = "crates/kumi-common" }
kumi-store = { path = "crates/kumi-store" }
kumi-genexpr = { path = "crates/kumi-genexpr" }
kumi-runtime = { path = "crates/kumi-runtime" }
ableton-mcp-server = { path = "daws/ableton/ableton-mcp-server" }
daw-bridge = { path = "daws/own/daw-bridge" }
kumi-testkit = { path = "crates/kumi-testkit" }
kumi-types = { path = "crates/kumi-types" }
kumi-net = { path = "crates/kumi-net" }
kumi-media = { path = "crates/kumi-media" }
kumi-ai = { path = "crates/kumi-ai" }
kumi-web = { path = "crates/kumi-web" }
kumi-library = { path = "crates/kumi-library" }
kumi-listening = { path = "crates/kumi-listening" }
kumi-daw-ableton = { path = "daws/ableton/kumi-daw-ableton" }

async-trait = "0.1"
base64 = "0.22"
blake3 = "1.8"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
crossterm = { version = "0.28", features = ["event-stream"] }
flate2 = "1"
futures = "0.3"
hex = "0.4"
hmac = "0.12"
ring = "0.17"
home = "0.5"
# JavaScript's Map: insertion order kept.
indexmap = "2"
# JavaScript localeCompare uses ICU collation (the same major as URL normalization).
icu_collator = "2.3"
icu_locale_core = "2.3"
libc = "0.2"
# MD5: the checksum Serum 2 keeps over a preset's compressed body.
md-5 = "0.10"
memchr = "2"
# ONNX Runtime is loaded at run time from the copy Kumi fetches on first use: nothing native at build time.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic", "api-23"] }
percent-encoding = "2"
fancy-regex = "0.14"
rand = "0.9"
regex = "1"
# Each client begins at kumi-runtime's net::client, with Kumi's own TLS and proxies; socks: an ALL_PROXY of socks5://.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "gzip", "brotli", "deflate", "http2", "socks"] }
# Kumi's TLS (net::trust): rustls with the features reqwest's has, the certificates it carries (webpki-roots), and this
# computer's own trust store when those don't vouch for a server: its check, or for the web tool its list of roots.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
rustls-native-certs = "0.8"
rustls-platform-verifier = "0.7"
# SQLite compiled in (FTS5, JSONB): no system library to find on any platform.
# Zstandard in pure Rust, for Serum 2's preset bodies.
ruzstd = "0.9"
rusqlite = { version = "0.40", features = ["bundled"] }
encoding_rs = "0.8"
ryu = "1"
# preserve_order: JSON objects keep insertion order, as JavaScript's do, so files and hashes come out the same.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10"
subtle = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
unicode-segmentation = "1"
unicode-normalization = "0.1"
unicode-width = "0.2"
url = "2"
uuid = { version = "1", features = ["v4"] }
webpki-roots = "1"

# Line tables are enough for a panic's backtrace; full debug info multiplies the build folder's size.
[profile.dev]
debug = "line-tables-only"

# Keep JSON byte scanning optimized for large protocol pages in development and tests.
[profile.dev.package.serde_json]
opt-level = 3

# The same for gzip: Sets, presets and the tests' recorded fixtures (tens of megabytes) are gzipped.
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.adler2]
opt-level = 3

# And regular expressions: the terminal's Markdown is matched by a backtracking one, which long lines take to its limit.
[profile.dev.package.fancy-regex]
opt-level = 3
[profile.dev.package.regex]
opt-level = 3
[profile.dev.package.regex-automata]
opt-level = 3
[profile.dev.package.regex-syntax]
opt-level = 3

# The GenExpr interpreter runs Kumi's building blocks a sample at a time in their tests: optimized, a song's worth of
# samples takes a moment instead of minutes.
[profile.dev.package.kumi-genexpr]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# REAPER's extension is never stripped by rustc: on macOS 27 (ld-27037) a rustc strip can leave the library's LINKEDIT
# string pool misaligned, depending on its symbol count, and dyld then refuses to load it. It's stripped after the
# build with the platform's own strip instead, which leaves it loadable.
[profile.dev.package.reaper-kumi]
strip = "none"

[profile.release.package.reaper-kumi]
strip = "none"

# The Installer's builds on pull requests and main, which are installed and checked but never published: the
# release build without whole-program optimization and with parallel code generation, to build faster. Tags, the
# builds that are published, use `release`.
[profile.ci-release]
inherits = "release"
lto = "off"
codegen-units = 16
# Installed and checked, never timed or published: less optimizing, for a build in half the time.
opt-level = 1

[profile.ci-release.package.reaper-kumi]
strip = "none"
