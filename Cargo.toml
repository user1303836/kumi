[workspace]
resolver = "2"
members = ["crates/kumi-common", "crates/kumi-store", "crates/kumi-genexpr", "crates/kumi-runtime", "crates/ableton-mcp-server", "crates/kumi"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/user1303836/kumi"
rust-version = "1.89"

[workspace.dependencies]
kumi-common = { path = "crates/kumi-common" }
kumi-store = { path = "crates/kumi-store" }
kumi-genexpr = { path = "crates/kumi-genexpr" }
kumi-runtime = { path = "crates/kumi-runtime" }
ableton-mcp-server = { path = "crates/ableton-mcp-server" }

async-trait = "0.1"
base64 = "0.22"
blake3 = "1.8"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
crossterm = { version = "0.28", features = ["event-stream"] }
flate2 = "1"
futures = "0.3"
hex = "0.4"
hmac = "0.12"
ring = "0.17"
home = "0.5"
# JavaScript's Map: insertion order kept.
indexmap = "2"
# JavaScript localeCompare uses ICU collation (the same major as URL normalization).
icu_collator = "2.3"
icu_locale_core = "2.3"
libc = "0.2"
# MD5: the checksum Serum 2 keeps over a preset's compressed body.
md-5 = "0.10"
memchr = "2"
# ONNX Runtime is loaded at run time from the copy Kumi fetches on first use: nothing native at build time.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic", "api-23"] }
percent-encoding = "2"
fancy-regex = "0.14"
rand = "0.9"
regex = "1"
# Each client begins at kumi-runtime's net::client, with Kumi's own TLS and proxies; socks: an ALL_PROXY of socks5://.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "gzip", "brotli", "deflate", "http2", "socks"] }
# Kumi's TLS (net::trust): rustls with the features reqwest's has, the certificates it carries (webpki-roots), and this
# computer's own trust store when those don't vouch for a server: its check, or for the web tool its list of roots.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
rustls-native-certs = "0.8"
rustls-platform-verifier = "0.7"
# SQLite compiled in (FTS5, JSONB): no system library to find on any platform.
# Zstandard in pure Rust, for Serum 2's preset bodies.
ruzstd = "0.9"
rusqlite = { version = "0.40", features = ["bundled"] }
encoding_rs = "0.8"
ryu = "1"
# preserve_order: JSON objects keep insertion order, as JavaScript's do, so files and hashes come out the same.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10"
subtle = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
unicode-segmentation = "1"
unicode-normalization = "0.1"
unicode-width = "0.2"
url = "2"
uuid = { version = "1", features = ["v4"] }
webpki-roots = "1"

# Clippy runs with -D warnings in CI. These of its lints the code goes against on purpose, so they're off:
# - type_complexity, too_many_arguments, result_large_err, large_enum_variant: the host's ported functions keep the
#   shapes and errors of the TypeScript they replaced, which their tests compare against;
# - needless_range_loop: the analysis code indexes parallel buffers by one index, which reads plainer than zips;
# - neg_cmp_op_on_partial_ord: `!(x > 0.0)` is how the code says "not a positive number, NaN included";
# - suspicious_else_formatting, possible_missing_else: the ported host writes guard clauses one after another on one
#   line;
# - nonminimal_bool, if_same_then_else, unnecessary_unwrap: conditions kept as the TypeScript wrote them (two reasons for
#   one outcome, a check and its unwrap side by side);
# - manual_clamp: `x.max(0.0).min(127.0)` takes NaN to the low end, which `clamp` doesn't.
[workspace.lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"
result_large_err = "allow"
large_enum_variant = "allow"
needless_range_loop = "allow"
neg_cmp_op_on_partial_ord = "allow"
suspicious_else_formatting = "allow"
possible_missing_else = "allow"
nonminimal_bool = "allow"
if_same_then_else = "allow"
unnecessary_unwrap = "allow"
manual_clamp = "allow"

# Line tables are enough for a panic's backtrace; full debug info multiplies the build folder's size.
[profile.dev]
debug = "line-tables-only"

# Keep JSON byte scanning optimized for large protocol pages in development and tests.
[profile.dev.package.serde_json]
opt-level = 3

# The GenExpr interpreter runs Kumi's building blocks a sample at a time in their tests: optimized, a song's worth of
# samples takes a moment instead of minutes.
[profile.dev.package.kumi-genexpr]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The Installer's builds on pull requests and main, which are installed and checked but never published: the
# release build without whole-program optimization and with parallel code generation, to build faster. Tags, the
# builds that are published, use `release`.
[profile.ci-release]
inherits = "release"
lto = "off"
codegen-units = 16
# Installed and checked, never timed or published: less optimizing, for a build in half the time.
opt-level = 1
