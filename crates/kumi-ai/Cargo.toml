[package]
name = "kumi-ai"
version = "0.1.0"
description = "Kumi's model clients: each provider's wire binding, the providers and their models, signing in, the models Kumi runs itself (ONNX Runtime), a turn's timing and how a failed call is told."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
kumi-common.workspace = true
kumi-net.workspace = true
kumi-types.workspace = true
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
futures.workspace = true
hex.workspace = true
home.workspace = true
indexmap.workspace = true
memchr.workspace = true
ort.workspace = true
rand.workspace = true
regex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
url.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
kumi-net = { workspace = true, features = ["test-support"] }
kumi-testkit.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

# build.rs compacts the bundled models catalog (key order kept, as the workspace's serde_json keeps it).
[build-dependencies]
serde_json.workspace = true
