[package]
name = "kumi-design"
version = "0.1.0"
description = "Sound design on a group of samples: cross (blend, attack, resonate, modulate), fuse (texture, loop, smear), stack and grow, steerable, seeded so a reroll is a variation and the same seed the same bytes; built optimized even in tests."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
kumi-common.workspace = true
kumi-media.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
