[package]
name = "kumi-media"
version = "0.1.0"
description = "Kumi's media layer: audio decoding, analysis and DSP, voice input, and the programs that decode media (ffmpeg, yt-dlp, whisper.cpp), fetched where they're needed."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
# What other crates' tests use of the audio: writing a test's sound files. Only as a dev-dependency.
test-support = []
# The player on Linux, through ALSA: its library (libasound) is then needed to build Kumi and to run it.
linux-player = ["dep:cpal"]

[dependencies]
kumi-common.workspace = true
kumi-net.workspace = true
kumi-types.workspace = true
async-trait.workspace = true
encoding_rs.workspace = true
futures.workspace = true
hex.workspace = true
home.workspace = true
indexmap.workspace = true
regex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# The player's output: Core Audio on a Mac, WASAPI on Windows; on Linux only with linux-player.
[target.'cfg(not(target_os = "linux"))'.dependencies]
cpal.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
cpal = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
