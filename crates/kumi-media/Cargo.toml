[package]
name = "kumi-media"
version = "0.1.0"
description = "Kumi's media layer: audio decoding, analysis and DSP, voice input, and the programs that decode media (ffmpeg, yt-dlp, whisper.cpp), fetched where they're needed."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

# What other crates' tests use of the audio: writing a test's sound files. Only as a dev-dependency.
[features]
test-support = []

[dependencies]
kumi-common.workspace = true
kumi-net.workspace = true
kumi-types.workspace = true
async-trait.workspace = true
encoding_rs.workspace = true
futures.workspace = true
hex.workspace = true
home.workspace = true
indexmap.workspace = true
regex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
