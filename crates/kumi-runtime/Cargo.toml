[package]
name = "kumi-runtime"
version = "1.9.0"
description = "Kumi's runtime: the agent kernel, model providers, the MCP client, the Ableton integration, audio, video, web and the producer's library."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "kumi_runtime"
path = "src/lib.rs"

# The device harness's isolated child.
[[bin]]
name = "kumi-harness"
path = "src/bin/kumi-harness.rs"

[[bin]]
name = "kumi-library-measure"
path = "src/bin/kumi-library-measure.rs"

[[bin]]
name = "kumi-library-learner"
path = "src/bin/kumi-library-learner.rs"

[dependencies]
kumi-common.workspace = true
kumi-store.workspace = true
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
encoding_rs.workspace = true
flate2.workspace = true
futures.workspace = true
hex.workspace = true
hmac.workspace = true
home.workspace = true
indexmap.workspace = true
memchr.workspace = true
percent-encoding.workspace = true
rand.workspace = true
regex.workspace = true
fancy-regex.workspace = true
reqwest.workspace = true
# Max for Live device code, run in a sandbox.
rquickjs = { version = "0.9", features = ["bindgen", "classes", "properties"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
unicode-segmentation.workspace = true
unicode-normalization.workspace = true
url.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
# live_views reads deep Set snapshots, as the bridge does.
serde_json = { workspace = true, features = ["unbounded_depth"] }
