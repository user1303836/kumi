[package]
name = "kumi"
version = "1.24.28"
description = "Kumi, a studio partner for Ableton Live: the command and the terminal app."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
default-run = "kumi"

[lib]
name = "kumi"
path = "src/lib.rs"

[[bin]]
name = "kumi"
path = "src/main.rs"

[dependencies]
kumi-common.workspace = true
kumi-types.workspace = true
kumi-net.workspace = true
kumi-media.workspace = true
kumi-ai.workspace = true
kumi-library.workspace = true
kumi-listening.workspace = true
kumi-agent.workspace = true
kumi-daw.workspace = true
kumi-daw-ableton.workspace = true
kumi-daw-reaper.workspace = true
kumi-daw-renoise.workspace = true
kumi-daw-own.workspace = true
daw-bridge.workspace = true
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
crossterm.workspace = true
flate2.workspace = true
futures.workspace = true
hex.workspace = true
home.workspace = true
memchr.workspace = true
rand.workspace = true
regex.workspace = true
fancy-regex.workspace = true
pulldown-cmark.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# The private file the draft goes to while the producer's editor has it (ctrl+g).
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true
url.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Power", "Win32_System_Threading"] }

[dev-dependencies]
# Live's bridge, as the tests of Live's provider (Willington's owner file, the native editing check) and the live examples
# read it.
ableton-mcp-server.workspace = true
# The agent's test helpers (a FOCUS view's row in DAWS.md, which daws_doc checks).
kumi-agent = { workspace = true, features = ["test-support"] }
kumi-store.workspace = true
# Where the changes eval example finds FFmpeg (the video tool's search for it).
kumi-web.workspace = true
uuid.workspace = true
kumi-testkit.workspace = true
tokio = { workspace = true, features = ["test-util"] }
daw-mcp-server = { path = "../../daws/own/daw-mcp-server" }
