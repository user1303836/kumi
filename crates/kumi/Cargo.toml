[package]
name = "kumi"
version = "1.21.1"
description = "Kumi, a studio partner for Ableton Live: the command and the terminal app."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
default-run = "kumi"

[lib]
name = "kumi"
path = "src/lib.rs"

[[bin]]
name = "kumi"
path = "src/main.rs"

[dependencies]
kumi-common.workspace = true
kumi-runtime.workspace = true
kumi-daw-ableton.workspace = true
kumi-daw-reaper.workspace = true
kumi-daw-renoise.workspace = true
ableton-mcp-server.workspace = true
daw-bridge.workspace = true
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
crossterm.workspace = true
flate2.workspace = true
futures.workspace = true
hex.workspace = true
home.workspace = true
memchr.workspace = true
rand.workspace = true
regex.workspace = true
fancy-regex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true
url.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Power", "Win32_System_Threading"] }

[dev-dependencies]
# The runtime's test helpers (a FOCUS view's row in DAWS.md, which daws_doc checks).
kumi-runtime = { workspace = true, features = ["test-support"] }
kumi-store.workspace = true
uuid.workspace = true
kumi-testkit.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
daw-mcp-server = { path = "../../daws/own/daw-mcp-server" }
