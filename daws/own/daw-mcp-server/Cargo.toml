[package]
name = "daw-mcp-server"
version = "1.24.76"
description = "The MCP host for Kumi's own bridges (REAPER, Renoise, SoundCraft): MCP over stdio, speaking to Kumi's bridge inside or beside the DAW."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "daw_mcp_server"
path = "src/lib.rs"

[[bin]]
name = "daw-mcp-server"
path = "src/bin/daw-mcp-server.rs"

[dependencies]
daw-bridge.workspace = true
kumi-common.workspace = true
base64.workspace = true
flate2.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
daw-bridge = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
