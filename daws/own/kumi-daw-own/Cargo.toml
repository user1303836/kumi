[package]
name = "kumi-daw-own"
version = "0.1.0"
description = "What the integrations of the DAWs whose bridges are Kumi's own (REAPER, Renoise) share, host side: the integration, the change engine, catching up, listening, the ears, phrases, pictures and FOCUS views, scripts, delivery to a spec, and what their libraries share."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
kumi-common.workspace = true
kumi-library.workspace = true
kumi-listening.workspace = true
kumi-media.workspace = true
kumi-runtime.workspace = true
kumi-types.workspace = true
# The system's name for where the DAWs' libraries are found, as daw-bridge's detection takes it.
daw-bridge.workspace = true
async-trait.workspace = true
chrono.workspace = true
futures.workspace = true
indexmap.workspace = true
regex.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
# The semantic diff Kumi's host reads, which catching up drafts from.
daw-mcp-server = { path = "../daw-mcp-server" }
tokio = { workspace = true, features = ["test-util"] }
