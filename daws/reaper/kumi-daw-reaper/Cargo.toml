[package]
name = "kumi-daw-reaper"
version = "0.1.0"
description = "Kumi's REAPER integration, host side: its refs, read tool and instructions, its changes, the tools only REAPER has (variations of its items, delivery, routing), and where its library is."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
kumi-common.workspace = true
kumi-daw-own.workspace = true
kumi-library.workspace = true
kumi-listening.workspace = true
kumi-agent.workspace = true
kumi-types.workspace = true
# Where REAPER keeps its library: the same detection as its bridge's setup.
daw-bridge.workspace = true
async-trait.workspace = true
regex.workspace = true
serde_json.workspace = true

[dev-dependencies]
# The agent's test helpers (core's checks of a backend's note variations).
kumi-agent = { workspace = true, features = ["test-support"] }
# The acceptance run against REAPER: Kumi's host and the semantic diff it reads.
daw-mcp-server = { path = "../../own/daw-mcp-server" }
futures.workspace = true
kumi-testkit.workspace = true
tokio.workspace = true
