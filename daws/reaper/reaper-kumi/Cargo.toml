[package]
name = "reaper-kumi"
version = "0.1.6"
description = "Kumi's REAPER extension: the bridge REAPER loads from UserPlugins."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
build = "build.rs"

[lib]
name = "reaper_kumi"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
base64.workspace = true
daw-bridge = { workspace = true }
kumi-common.workspace = true
serde_json = { workspace = true }
tempfile.workspace = true

[dev-dependencies]
kumi-testkit.workspace = true
hex = { workspace = true }

[build-dependencies]
cc = "1"
