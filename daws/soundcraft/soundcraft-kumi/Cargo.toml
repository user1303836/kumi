[package]
name = "soundcraft-kumi"
version = "1.24.67"
description = "Kumi's bridge beside SoundCraft: the client of SoundCraft's control channel, SoundCraft started with it on, and kumi-daw/1 for Kumi's host."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "soundcraft_kumi"
path = "src/lib.rs"

[[bin]]
name = "soundcraft-kumi"
path = "src/main.rs"

[dependencies]
daw-bridge.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
# Kumi's host's own client of a bridge, which the server's tests connect with.
daw-mcp-server = { path = "../../own/daw-mcp-server" }
tempfile.workspace = true
