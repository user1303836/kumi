name: kumi
# The Kumi release the plugin pins (kumi_release.json): the pin pull request sets both.
version: "1.24.67"
description: >-
  Kumi for Hermes: Hermes reads your Ableton Live, REAPER or Renoise project and makes the changes you approve,
  each kept in Kumi's HISTORY and undoable while Kumi runs. Kumi measures audio on your computer and maps the
  sample folders you choose, to find, audition and place sounds. It also reads finished audio other Hermes plugins
  saved in this profile's generated audio folder, to place or measure it.
author: Kumi
homepage: https://github.com/user1303836/kumi/tree/main/hermes-plugin
license: MIT
requires_hermes: ">=0.22.7"
provides_tools: [kumi_status, kumi_setup, kumi_connect, kumi_observe, kumi_read, kumi_change, kumi_undo,
                 kumi_history, kumi_listen, kumi_sounds, kumi_library, kumi_job]
provides_hooks: [pre_tool_call, post_approval_response, post_tool_call, pre_llm_call, post_compaction,
                 on_session_finalize, agent_loop_stopped]
config_schema:
  inject_focus:
    type: bool
    default: true
    label: Tell the agent what you're looking at
    description: "Adds a short FOCUS and catch-up note to the chat connected to Kumi when what you're looking at changes. Notes stay in the chat's history."
  daw:
    type: str
    choices: [ableton, reaper, renoise]
    default: ableton
    label: DAW
    description: "The DAW Kumi connects to: Ableton Live (ableton), REAPER (reaper) or Renoise (renoise)."
  library_folders:
    type: list
    default: []
    label: Sample folders
    description: "Folders Kumi may read to build your sound map, as a list of full paths, such as [\"/Users/me/Samples\"]. Nothing else is scanned. In a chat, ask Hermes to add one: it asks you first."
  listen_interpretation:
    type: bool
    default: false
    label: Interpret measurements with a model
    description: "After Kumi measures audio, the model set for Kumi listening interpretation in Hermes's model settings (it follows Vision unless you change it, and must accept images) reads the numbers and a coarse band-energy image, never the audio. Its reading is added beside the measurements, which stay either way. The model or Hermes's fallback providers for that task may cost tokens."
