# What a change touches beyond the Rust packages, read by scripts/dev.py: whether Required CI builds Rust for it, and what
# `dev.py check --tests` tests. Every tracked file belongs to a Cargo package (the longest manifest folder holding it), to
# one or more areas here, or to both: `python3 scripts/dev.py affected --check` fails on a file that belongs to neither.
#
# - paths: globs from the repository's root. `*` and `?` stay inside a folder; `**` crosses folders.
# - feeds: the packages that read these files when they build or test ("*": every one). A change here affects them as
#   if it were their own, and so the packages that depend on them.
# - except: globs of files the paths match that aren't the area's.
# - layout: a file added, removed or renamed under these globs counts as one of this area's.
# - rust: false when a change here builds no Rust package (unless another area holding the same file does): Required
#   CI then skips formatting and the build for a change to these files alone.

# Words for people: a change to these alone builds and tests nothing.
[docs]
paths = ["docs/**", "**/*.md", "LICENSE*"]

# The workspace's own settings: every package builds and tests by them.
[workspace]
paths = ["Cargo.toml", "Cargo.lock", "rustfmt.toml", ".config/**", ".cargo/**"]
feeds = ["*"]

# The test runners every Rust job runs.
[test-runners]
paths = ["scripts/test-isolated.sh", "scripts/test-isolated.ps1"]
feeds = ["*"]

# Live's operation registry: the bridge ships it, and the Remote Script, the host and Kumi read it.
[protocol]
paths = ["daws/ableton/protocol/**"]
feeds = ["ableton-mcp-server", "kumi-common", "kumi-agent", "kumi-daw-ableton"]

# The Remote Script, which runs inside Live: the bridge carries and installs it, and its hash is checked against it.
[remote-script]
paths = ["daws/ableton/remote-script/**"]
feeds = ["ableton-mcp-server", "kumi-agent", "kumi-daw-ableton", "kumi"]

# Kumi's Live extension (TypeScript), with its committed build.
[live-extension]
paths = ["daws/ableton/live-extension/**"]
feeds = ["ableton-mcp-server", "kumi"]

# Kumi's Renoise tool (Lua) and its tests against a mock of Renoise's API.
[renoise-tool]
paths = ["daws/renoise/com.kumi.Bridge.xrnx/**", "daws/renoise/tests/**"]
rust = false

# What Kumi reads of the tool: its entry, manifest, version, change kinds and actions (Kumi's list of them, and the fields
# each offers, are checked against them), and the folder as it's installed.
[renoise-tool-read]
paths = [
  "daws/renoise/com.kumi.Bridge.xrnx/main.lua",
  "daws/renoise/com.kumi.Bridge.xrnx/manifest.xml",
  "daws/renoise/com.kumi.Bridge.xrnx/payload/actions.lua",
  "daws/renoise/com.kumi.Bridge.xrnx/payload/bridge.lua",
  "daws/renoise/com.kumi.Bridge.xrnx/payload/changes*.lua",
  "daws/renoise/com.kumi.Bridge.xrnx/payload/instruments.lua",
  "daws/renoise/com.kumi.Bridge.xrnx/payload/version.lua",
]
layout = ["daws/renoise/com.kumi.Bridge.xrnx/**"]
feeds = ["kumi-agent", "kumi"]

# Kumi's Hermes Agent plugin (Python, with its Desktop and dashboard halves): the Hermes catalog installs this folder
# alone, so nothing in it reaches outside it. Main's CI holds it to Hermes's own checks (the Hermes plugin job).
[hermes-plugin]
paths = ["hermes-plugin/**"]
rust = false

# What Kumi reads of REAPER's extension: its change code (Kumi's kinds and their fields are checked against it).
[reaper-extension-read]
paths = ["daws/reaper/reaper-kumi/src/changes/**"]
feeds = ["kumi"]

# What Kumi builds in as data: the standard Max patchers are held to, and the plug-in formats it reads.
[data]
paths = ["daws/ableton/max-standard/**", "plugin-formats/**"]
feeds = ["kumi-agent", "kumi-library", "kumi-daw-ableton", "daw-mcp-server"]

# The recorded oracles, which the tests of the crates their folders name read (through kumi-testkit).
[oracles]
paths = ["testdata/oracles/**"]
feeds = ["ableton-mcp-server", "kumi-common", "kumi-library", "kumi-agent", "kumi-daw-ableton", "kumi"]

# The eval's fixtures: Live's own device parameters, which the runtime's listening tests read too.
[eval-fixtures]
paths = ["crates/kumi/examples/fixtures/**"]
feeds = ["kumi-agent", "kumi-daw-ableton"]

# Willington's runtime files, which the bridge ships (only the owner's willington/ pull requests change them).
[willington]
paths = ["vendor/willington/**"]
feeds = ["ableton-mcp-server", "kumi-agent", "kumi-daw-ableton", "kumi"]

# The installers.
[installers]
paths = ["install.sh", "install.ps1"]
feeds = ["kumi-agent", "kumi"]

# The npm package at the root (`npm run kumi`), which carries Kumi's version.
[root-package]
paths = ["package.json"]
feeds = ["ableton-mcp-server", "kumi"]

# The release, packaging and migration scripts and their tests.
[release-scripts]
paths = ["scripts/**"]

# CI itself.
[workflows]
paths = [".github/**"]

# The repository's own settings for git and for search.
[repo]
paths = [".gitattributes", ".gitignore", ".ignore"]
