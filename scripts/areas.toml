# What CI tests beyond the Rust packages, read by scripts/dev.py. Every tracked file belongs to a Cargo package (the
# longest manifest folder holding it), to one or more areas here, or to both: `python3 scripts/dev.py affected --check`
# fails on a file that belongs to neither.
#
# - paths: globs from the repository's root. `*` and `?` stay inside a folder; `**` crosses folders.
# - feeds: the packages that read these files when they build or test ("*": every one). A change here affects them as
#   if it were their own, and so the packages that depend on them.
# - except: globs of files the paths match that aren't the area's.
# - layout: a file added, removed or renamed under these globs counts as one of this area's.

# Words for people: a change to these alone builds and tests nothing.
[docs]
paths = ["docs/**", "**/*.md", "LICENSE*"]

# The workspace's own settings: every package builds and tests by them.
[workspace]
paths = ["Cargo.toml", "Cargo.lock", "rustfmt.toml", ".config/**", ".cargo/**"]
feeds = ["*"]

# The test runners every Rust job runs.
[test-runners]
paths = ["scripts/test-isolated.sh", "scripts/test-isolated.ps1"]
feeds = ["*"]

# Live's operation registry: the bridge ships it, and the Remote Script, the host and Kumi read it.
[protocol]
paths = ["daws/ableton/protocol/**"]
feeds = ["ableton-mcp-server", "kumi-common", "kumi-agent", "kumi-daw-ableton"]

# The Remote Script, which runs inside Live: the bridge carries and installs it, and its hash is checked against it.
[remote-script]
paths = ["daws/ableton/remote-script/**"]
feeds = ["ableton-mcp-server", "kumi-agent", "kumi-daw-ableton", "kumi"]

# Kumi's Live extension (TypeScript), with its committed build.
[live-extension]
paths = ["daws/ableton/live-extension/**"]
feeds = ["ableton-mcp-server", "kumi"]

# Kumi's Renoise tool (Lua) and its tests against a mock of Renoise's API.
[renoise-tool]
paths = ["daws/renoise/com.kumi.Bridge.xrnx/**", "daws/renoise/tests/**"]

# What Kumi reads of the tool: its entry, manifest, version, change kinds and actions (Kumi's list of them, and the fields
# each offers, are checked against them), and the folder as it's installed.
[renoise-tool-read]
paths = [
  "daws/renoise/com.kumi.Bridge.xrnx/main.lua",
  "daws/renoise/com.kumi.Bridge.xrnx/manifest.xml",
  "daws/renoise/com.kumi.Bridge.xrnx/payload/actions.lua",
  "daws/renoise/com.kumi.Bridge.xrnx/payload/bridge.lua",
  "daws/renoise/com.kumi.Bridge.xrnx/payload/changes*.lua",
  "daws/renoise/com.kumi.Bridge.xrnx/payload/instruments.lua",
  "daws/renoise/com.kumi.Bridge.xrnx/payload/version.lua",
]
layout = ["daws/renoise/com.kumi.Bridge.xrnx/**"]
feeds = ["kumi-agent", "kumi"]

# REAPER's extension as it ships: its crate and the release script's check of what a bundle may carry (with what the
# DAW list says of the extension).
[reaper-extension]
paths = ["daws/reaper/reaper-kumi/**", "scripts/build-native-release.py", "scripts/daws.toml"]

# What Kumi reads of REAPER's extension: its change code (Kumi's kinds and their fields are checked against it).
[reaper-extension-read]
paths = ["daws/reaper/reaper-kumi/src/changes/**"]
feeds = ["kumi"]

# What Kumi builds in as data: the standard Max patchers are held to, and the plug-in formats it reads.
[data]
paths = ["daws/ableton/max-standard/**", "plugin-formats/**"]
feeds = ["kumi-agent", "kumi-library", "kumi-daw-ableton", "daw-mcp-server"]

# The recorded oracles, which the tests of the crates their folders name read (through kumi-testkit), and the list of
# those only Extended's tests read.
[oracles]
paths = ["testdata/oracles/**"]
feeds = ["ableton-mcp-server", "kumi-common", "kumi-library", "kumi-agent", "kumi-daw-ableton", "kumi"]

# The eval's fixtures: Live's own device parameters, which the runtime's listening tests read too.
[eval-fixtures]
paths = ["crates/kumi/examples/fixtures/**"]
feeds = ["kumi-agent", "kumi-daw-ableton"]

# Willington's runtime files, which the bridge ships (only the owner's willington/ pull requests change them).
[willington]
paths = ["vendor/willington/**"]
feeds = ["ableton-mcp-server", "kumi-agent", "kumi-daw-ableton", "kumi"]

# The installers.
[installers]
paths = ["install.sh", "install.ps1"]
feeds = ["kumi-agent", "kumi"]

# The npm package at the root (`npm run kumi`), which carries Kumi's version.
[root-package]
paths = ["package.json"]
feeds = ["ableton-mcp-server", "kumi"]

# The install surface: a pull request that changes any of it runs the Installer's builds and installs. The tests and
# examples beside these files aren't part of it.
[install]
paths = [
  "install.sh",
  "install.ps1",
  "crates/kumi/src/install.rs",
  "crates/kumi/src/install/**",
  "crates/kumi/src/update.rs",
  "crates/kumi/src/process.rs",
  "crates/kumi-daw/src/process.rs",
  "crates/kumi/src/doctor.rs",
  "crates/kumi/src/doctor/installation.rs",
  "daws/ableton/kumi-daw-ableton/src/app/bridge_setup.rs",
  "daws/ableton/kumi-daw-ableton/src/app/live_extension.rs",
  "daws/ableton/kumi-daw-ableton/src/app/live_app.rs",
  "daws/own/kumi-daw-own/src/provider.rs",
  "daws/reaper/kumi-daw-reaper/src/provider.rs",
  "daws/renoise/kumi-daw-renoise/src/provider.rs",
  "crates/kumi-types/src/system.rs",
  "crates/kumi-ai/src/http.rs",
  "crates/kumi-library/src/sources.rs",
  "crates/kumi-net/src/lib.rs",
  "crates/kumi-net/src/proxy.rs",
  "crates/kumi-net/src/trust.rs",
  "daws/ableton/kumi-daw-ableton/src/hands/KumiHands.swift",
  "daws/ableton/kumi-daw-ableton/src/hands/mac.rs",
  "daws/ableton/ableton-mcp-server/src/lifecycle.rs",
  "daws/ableton/ableton-mcp-server/src/lifecycle/**",
  "daws/own/daw-bridge/Cargo.toml",
  "daws/own/daw-bridge/src/lifecycle.rs",
  "daws/own/daw-bridge/src/install.rs",
  "daws/own/daw-bridge/src/detect.rs",
  "daws/own/daw-bridge/src/files.rs",
  "daws/own/daw-bridge/src/owner.rs",
  "daws/own/daw-bridge/src/paths.rs",
  "daws/own/daw-mcp-server/Cargo.toml",
  "daws/own/daw-mcp-server/src/bin/**",
  "daws/reaper/reaper-kumi/build.rs",
  "daws/reaper/reaper-kumi/Cargo.toml",
  "daws/reaper/reaper-kumi/shim/**",
  "daws/reaper/reaper-kumi/sdk/**",
  "daws/reaper/reaper-kumi/src/lib.rs",
  "daws/renoise/com.kumi.Bridge.xrnx/manifest.xml",
  "daws/renoise/com.kumi.Bridge.xrnx/main.lua",
  "daws/renoise/com.kumi.Bridge.xrnx/payload/version.lua",
  "scripts/build-native-release.py",
  "scripts/build-migration-release.py",
  "scripts/daws.toml",
  "scripts/build-hands.py",
  "scripts/release.py",
  "scripts/check-installers.sh",
  "scripts/vendor-willington.py",
  "scripts/migration/**",
  "vendor/willington/**",
  ".github/workflows/installer.yml",
]
# The bridge's lifecycle module is install surface, but for its read-only diagnostics.
except = ["**/tests/**", "**/examples/**", "**/tests.rs", "daws/ableton/ableton-mcp-server/src/lifecycle/diagnostics.rs"]

# How Kumi's HTTP clients are made, which the Network workflow checks on each system's own trust store and proxies.
[network]
paths = ["crates/kumi-net/src/lib.rs", "crates/kumi-net/src/proxy.rs", "crates/kumi-net/src/trust.rs", "crates/kumi-net/tests/it/network.rs", ".github/workflows/network.yml"]

# The release, packaging and migration scripts and their tests.
[release-scripts]
paths = ["scripts/**"]

# CI itself.
[workflows]
paths = [".github/**"]

# CI's own workflow: its every job runs for a change to it.
[ci]
paths = [".github/workflows/ci.yml"]

# The repository's own settings for git and for search.
[repo]
paths = [".gitattributes", ".gitignore", ".ignore"]
