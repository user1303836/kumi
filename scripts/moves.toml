# Where the repository's paths moved, oldest first. `python3 scripts/dev.py rebase-moves` reads it to bring a branch
# that began before a move onto main (see dev.py's docstring), and scripts/release.py to read history across moves.
#
# - [[move]]: a file or folder that moved, from the repository's root. Git follows a moved folder when it rebases (files
#   the branch adds in it included); dev.py rewrites the old path where the lines the branch adds name it.
# - [[rust]]: a Rust path that moved with its code. dev.py rewrites it in the lines the branch adds, e.g.
#   from = "kumi_runtime::core::daw"
#   to = "kumi_types::daw"
#   A path from a crate's root (`crate::…`) names the crate's folder with `in`, and moves only in the files under it.

# Live's code, into daws/ableton (2026-10).
